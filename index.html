<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NexaHub | Premium Ecosystem</title>
    <meta name="description" content="Экосистема премиальных модулей, плагинов и ботов для развития ваших проектов.">
    <meta name="theme-color" content="#0f172a">
    
    <!-- PWA & Mobile Optimizations -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NexaHub">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-TileColor" content="#0f172a">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            /* Palette */
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.6);
            --secondary: #ec4899;
            --secondary-glow: rgba(236, 72, 153, 0.6);
            --accent: #8b5cf6;
            --bg-dark: #020617;
            --bg-card: rgba(30, 41, 59, 0.4);
            --bg-card-hover: rgba(51, 65, 85, 0.6);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(148, 163, 184, 0.08);
            --success: #10b981;
            --warning: #f59e0b;
            
            /* Physics & Motion */
            --ease-elastic: cubic-bezier(0.34, 1.56, 0.64, 1);
            --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
            --ease-out: cubic-bezier(0.215, 0.61, 0.355, 1);
            
            /* Effects */
            --glass-bg: blur(16px) saturate(180%);
            --glass-border: 1px solid rgba(255, 255, 255, 0.08);
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-glow: 0 0 20px var(--primary-glow);
            --shadow-card: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(99, 102, 241, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(236, 72, 153, 0.08), transparent 25%);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.6;
            scroll-behavior: smooth;
        }

        /* Animated Aurora Background */
        .aurora {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }

        .aurora-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            animation: floatBlob 20s infinite ease-in-out;
            will-change: transform, opacity;
        }

        .blob-1 { top: -10%; left: -10%; width: 50vw; height: 50vw; background: var(--primary); animation-delay: 0s; }
        .blob-2 { bottom: -10%; right: -10%; width: 60vw; height: 60vw; background: var(--secondary); animation-delay: -5s; }
        .blob-3 { top: 40%; left: 40%; width: 40vw; height: 40vw; background: var(--accent); animation-delay: -10s; }

        @keyframes floatBlob {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -40px) scale(1.1); }
            66% { transform: translate(-20px, 30px) scale(0.95); }
        }

        /* Layout */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
            position: relative;
            z-index: 1;
        }

        /* Header */
        header {
            text-align: center;
            padding: 60px 0 40px;
            animation: fadeInDown 0.8s var(--ease-smooth);
        }

        h1 {
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 800;
            background: linear-gradient(135deg, #fff 0%, var(--primary) 50%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 16px;
            letter-spacing: -0.03em;
            text-shadow: 0 10px 30px rgba(99, 102, 241, 0.2);
            cursor: default;
            position: relative;
            display: inline-block;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.125rem;
            max-width: 600px;
            margin: 0 auto;
            font-weight: 300;
        }

        /* Search Bar */
        .search-container {
            position: relative;
            max-width: 560px;
            margin: 40px auto 0;
            animation: fadeInUp 0.8s var(--ease-smooth) 0.2s backwards;
        }

        .search-input {
            width: 100%;
            padding: 18px 24px 18px 56px;
            border-radius: 20px;
            border: var(--glass-border);
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: var(--glass-bg);
            color: var(--text-main);
            font-size: 1rem;
            transition: all 0.3s var(--ease-smooth);
            outline: none;
            box-shadow: var(--shadow-sm);
        }

        .search-input:focus {
            background: rgba(15, 23, 42, 0.8);
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15), var(--shadow-glow);
            transform: translateY(-2px);
        }

        .search-icon {
            position: absolute;
            left: 24px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            transition: color 0.3s;
            font-size: 1.1rem;
        }

        .search-input:focus + .search-icon { color: var(--primary); }

        /* Tabs Navigation */
        .tabs-wrapper {
            margin: 40px 0 30px;
            animation: fadeInUp 0.8s var(--ease-smooth) 0.3s backwards;
            position: sticky;
            top: 20px;
            z-index: 50;
        }

        .tabs {
            display: flex;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: var(--glass-bg);
            padding: 6px;
            border-radius: 16px;
            border: var(--glass-border);
            box-shadow: var(--shadow-card);
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            gap: 4px;
        }

        .tabs::-webkit-scrollbar { display: none; }

        .tab-btn {
            flex: 1;
            min-width: max-content;
            padding: 12px 20px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.4s var(--ease-elastic);
            white-space: nowrap;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }

        .tab-btn i { transition: transform 0.4s var(--ease-elastic); font-size: 1.1rem; }

        .tab-btn.active {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
            transform: translateY(-2px);
        }

        .tab-btn.active i { transform: scale(1.1) rotate(5deg); }

        .tab-btn:hover:not(.active) {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            transform: translateY(-1px);
        }

        /* Content Grid */
        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 28px;
            padding-bottom: 60px;
            min-height: 400px;
        }

        /* Cards */
        .card {
            background: var(--bg-card);
            backdrop-filter: var(--glass-bg);
            border: var(--glass-border);
            border-radius: 24px;
            padding: 28px;
            transition: all 0.5s var(--ease-elastic);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            opacity: 0;
            transform: translateY(40px) scale(0.95);
            animation: cardEnter 0.7s var(--ease-out) forwards;
            will-change: transform, opacity;
        }

        .card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: rgba(99, 102, 241, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 30px rgba(99, 102, 241, 0.15);
            background: var(--bg-card-hover);
            z-index: 10;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            opacity: 0;
            transition: opacity 0.4s var(--ease-smooth);
        }

        .card:hover::before { opacity: 1; }

        .card-header {
            display: flex;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 20px;
        }

        .icon-wrapper {
            width: 64px;
            height: 64px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.75rem;
            position: relative;
            transition: all 0.5s var(--ease-elastic);
            will-change: transform, filter;
            flex-shrink: 0;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        /* Icon Variants */
        .icon-plugin { background: rgba(99, 102, 241, 0.15); color: #818cf8; }
        .icon-module { background: rgba(236, 72, 153, 0.15); color: #f472b6; }
        .icon-bot { background: rgba(139, 92, 246, 0.15); color: #a78bfa; }
        .icon-app { background: rgba(16, 185, 129, 0.15); color: #34d399; }

        .card:hover .icon-wrapper {
            transform: scale(1.15) rotate(-5deg);
            filter: drop-shadow(0 0 15px currentColor);
        }

        /* Floating Animations */
        .icon-plugin { animation: floatIconPlugin 4s ease-in-out infinite; }
        .icon-module { animation: floatIconModule 4.5s ease-in-out infinite; }
        .icon-bot { animation: floatIconBot 5s ease-in-out infinite; }
        .icon-app { animation: floatIconApp 5.5s ease-in-out infinite; }

        @keyframes floatIconPlugin { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
        @keyframes floatIconModule { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
        @keyframes floatIconBot { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
        @keyframes floatIconApp { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

        .card-info { flex: 1; display: flex; flex-direction: column; }

        .card-title {
            font-size: 1.35rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-main);
            line-height: 1.3;
        }

        .card-desc {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 24px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            flex-grow: 1;
        }

        .card-meta {
            display: flex;
            gap: 10px;
            margin-top: auto;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .badge {
            font-size: 0.7rem;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            backdrop-filter: blur(4px);
        }

        .badge-new { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
        .badge-hot { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
        .badge-premium { background: rgba(236, 72, 153, 0.2); color: #f472b6; border: 1px solid rgba(236, 72, 153, 0.3); }

        .card-actions {
            display: flex;
            gap: 12px;
            margin-top: auto;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border-radius: 14px;
            border: none;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s var(--ease-elastic);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            position: relative;
            overflow: hidden;
            will-change: transform;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.5);
            filter: brightness(1.1);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid var(--border);
            backdrop-filter: blur(4px);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-3px);
            border-color: var(--text-muted);
        }

        .btn:active { transform: scale(0.96); }

        /* Page Transitions */
        .page-section {
            display: none;
            animation: pageFadeIn 0.6s var(--ease-smooth) forwards;
        }

        .page-section.active-page { display: block; }

        @keyframes pageFadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes cardEnter {
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-40px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }

        /* Scroll Top */
        .scroll-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 54px;
            height: 54px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border: var(--glass-border);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            cursor: pointer;
            opacity: 0;
            visibility: hidden;
            transform: translateY(20px) rotate(180deg);
            transition: all 0.5s var(--ease-elastic);
            z-index: 100;
            box-shadow: var(--shadow-card);
        }

        .scroll-top.visible {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) rotate(0deg);
        }

        .scroll-top:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-8px) rotate(-15deg);
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(16px);
            padding: 16px 28px;
            border-radius: 16px;
            border: var(--glass-border);
            color: var(--text-main);
            font-weight: 500;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            z-index: 1000;
            opacity: 0;
            transition: all 0.5s var(--ease-elastic);
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 300px;
            justify-content: center;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .toast i { color: var(--success); font-size: 1.3rem; filter: drop-shadow(0 0 8px rgba(16, 185, 129, 0.6)); }

        /* Responsive */
        @media (max-width: 768px) {
            h1 { font-size: 2.2rem; }
            .content-grid { grid-template-columns: 1fr; gap: 20px; }
            .tabs { padding: 4px; }
            .tab-btn { font-size: 0.9rem; padding: 10px 16px; }
            .card-actions { flex-direction: column; }
            .btn { width: 100%; }
            .container { padding: 16px; }
        }

        /* Search Highlight */
        mark {
            background: rgba(245, 158, 11, 0.25);
            color: #fbbf24;
            border-radius: 4px;
            padding: 0 2px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- Dynamic Background -->
    <div class="aurora">
        <div class="aurora-blob blob-1"></div>
        <div class="aurora-blob blob-2"></div>
        <div class="aurora-blob blob-3"></div>
    </div>

    <div class="container">
        <header>
            <h1 id="main-title">NexaHub</h1>
            <p class="subtitle">Экосистема премиальных решений для автоматизации и масштабирования ваших проектов</p>
            
            <div class="search-container">
                <i class="fas fa-search search-icon"></i>
                <input type="text" class="search-input" id="searchInput" placeholder="Найти плагин, модуль или бота..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
            </div>
        </header>

        <nav class="tabs-wrapper">
            <div class="tabs" role="tablist">
                <button class="tab-btn active" data-tab="plugins" role="tab" aria-selected="true">
                    <i class="fas fa-puzzle-piece"></i> Плагины
                </button>
                <button class="tab-btn" data-tab="modules" role="tab" aria-selected="false">
                    <i class="fas fa-cubes"></i> Модули
                </button>
                <button class="tab-btn" data-tab="bots" role="tab" aria-selected="false">
                    <i class="fas fa-robot"></i> Боты
                </button>
                <button class="tab-btn" data-tab="apps" role="tab" aria-selected="false">
                    <i class="fas fa-mobile-alt"></i> Приложения
                </button>
            </div>
        </nav>

        <main>
            <section id="plugins" class="page-section active-page" role="tabpanel">
                <div class="content-grid" id="plugins-grid"></div>
            </section>

            <section id="modules" class="page-section" role="tabpanel">
                <div class="content-grid" id="modules-grid"></div>
            </section>

            <section id="bots" class="page-section" role="tabpanel">
                <div class="content-grid" id="bots-grid"></div>
            </section>

            <section id="apps" class="page-section" role="tabpanel">
                <div class="content-grid" id="apps-grid"></div>
            </section>
        </main>
    </div>

    <!-- UI Components -->
    <div class="scroll-top" id="scrollTopBtn" aria-label="Наверх">
        <i class="fas fa-arrow-up"></i>
    </div>

    <div class="toast" id="toast" role="alert">
        <i class="fas fa-check-circle"></i>
        <span id="toastMessage">Операция выполнена успешно</span>
    </div>

        const data = {

                { id: 14, title: "Backup Master", desc: "Полное резервное копирование настроек сервера, каналов и ролей в один клик.", icon: "fa-database", type: "plugin", badge: "" },
                { id: 15, title: "Fun Games Pack", desc: "Набор мини-игр: викторины, слова, мафия и рулетка для развлечения участников.", icon: "fa-gamepad", type: "plugin", badge: "new" },
                { id: 16, title: "Stream Notifier", desc: "Уведомления о стримах на Twitch, YouTube и других платформах с кастомными сообщениями.", icon: "fa-video", type: "plugin", badge: "" },
                { id: 17, title: "Captcha Verify", desc: "Проверка новых пользователей через капчу для максимальной защиты от ботов.", icon: "fa-robot", type: "plugin", badge: "hot" }
            ],
            modules: [
                { id: 101, title: "Auth Module", desc: "Готовая система авторизации через Telegram и Discord с поддержкой JWT токенов.", icon: "fa-key", type: "module", badge: "premium" },
                { id: 102, title: "Payment Gateway", desc: "Интеграция платежных систем (Stripe, Crypto) для приема оплат внутри вашего приложения.", icon: "fa-credit-card", type: "module", badge: "hot" },
                { id: 103, title: "Notification Core", desc: "Централизованная система уведомлений: Email, Push, Telegram, Webhook.", icon: "fa-bell", type: "module", badge: "" },
                { id: 104, title: "Cache Manager", desc: "Высокопроизводительный кэширующий слой для ускорения работы базы данных.", icon: "fa-bolt", type: "module", badge: "new" }
            ],
            bots: [
                { id: 201, title: "Support Assistant", desc: "AI-бот техподдержки, обученный на вашей базе знаний. Отвечает 24/7.", icon: "fa-headset", type: "bot", badge: "premium" },
                { id: 202, title: "Content Curator", desc: "Бот для автоматического постинга контента из RSS и социальных сетей.", icon: "fa-rss", type: "bot", badge: "" },
                { id: 203, title: "Analytics Spy", desc: "Сбор глубокой аналитики поведения пользователей и построение воронок продаж.", icon: "fa-eye", type: "bot", badge: "hot" }
            ],
            apps: [
                { id: 301, title: "Nexa Dashboard", desc: "Веб-приложение для управления всеми сервисами NexaHub в одном месте.", icon: "fa-laptop-code", type: "app", badge: "new" },
                { id: 302, title: "Mobile Companion", desc: "Мобильное приложение для получения уведомлений и быстрого доступа к функциям.", icon: "fa-mobile-screen", type: "app", badge: "premium" },
                { id: 303, title: "Dev Toolkit", desc: "Набор инструментов для разработчиков: генераторы, валидаторы, сниппеты.", icon: "fa-toolbox", type: "app", badge: "" }
            ]
        };

        // DOM Elements
        const tabs = document.querySelectorAll('.tab-btn');
        const sections = document.querySelectorAll('.page-section');
        const searchInput = document.getElementById('searchInput');
        const scrollTopBtn = document.getElementById('scrollTopBtn');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toastMessage');

        // Render Logic
        function renderCards(category, containerId, searchTerm = '') {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            
            const items = data[category].filter(item => 
                item.title.toLowerCase().includes(searchTerm.toLowerCase()) || 
                item.desc.toLowerCase().includes(searchTerm.toLowerCase())
            );

            if (items.length === 0) {
                container.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 60px 20px; color: var(--text-muted); animation: fadeInUp 0.5s ease;">
                        <div style="font-size: 4rem; margin-bottom: 20px; opacity: 0.3;"><i class="fas fa-search"></i></div>
                        <h3 style="font-size: 1.5rem; margin-bottom: 10px; color: var(--text-main)">Ничего не найдено</h3>
                        <p>Попробуйте изменить поисковый запрос или выбрать другую категорию</p>
                    </div>
                `;
                return;
            }

            items.forEach((item, index) => {
                const delay = index * 60; 
                const badgeHtml = item.badge ? `<span class="badge badge-${item.badge}">${item.badge}</span>` : '';
                
                let displayTitle = item.title;
                let displayDesc = item.desc;
                if (searchTerm) {
                    const regex = new RegExp(`(${searchTerm})`, 'gi');
                    displayTitle = displayTitle.replace(regex, '<mark>$1</mark>');
                    displayDesc = displayDesc.replace(regex, '<mark>$1</mark>');
                }

                const card = document.createElement('div');
                card.className = 'card';
                card.style.animationDelay = `${delay}ms`;
                card.innerHTML = `
                    <div class="card-header">
                        <div class="icon-wrapper icon-${item.type}">
                            <i class="fas ${item.icon}"></i>
                        </div>
                        <div class="card-info">
                            <h3 class="card-title">${displayTitle}</h3>
                            <div class="card-meta">${badgeHtml}</div>
                        </div>
                    </div>
                    <p class="card-desc">${displayDesc}</p>
                    <div class="card-actions">
                        <button class="btn btn-primary" onclick="showToast('Загрузка ${item.title}...')">
                            <i class="fas fa-download"></i> Скачать
                        </button>
                        <button class="btn btn-secondary" onclick="showToast('Открываем информацию о ${item.title}')">
                            <i class="fas fa-info-circle"></i> Инфо
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Tab Switching
        function switchTab(tabName) {
            tabs.forEach(btn => {
                const isActive = btn.dataset.tab === tabName;
                btn.classList.toggle('active', isActive);
                btn.setAttribute('aria-selected', isActive);
            });

            sections.forEach(section => {
                const isActive = section.id === tabName;
                section.classList.toggle('active-page', isActive);
                
                if (isActive) {
                    const cards = section.querySelectorAll('.card');
                    cards.forEach((card, idx) => {
                        card.style.animation = 'none';
                        card.offsetHeight; 
                        card.style.animation = `cardEnter 0.7s var(--ease-out) forwards ${idx * 60}ms`;
                    });
                }
            });
        }

        // Event Listeners
        tabs.forEach(tab => tab.addEventListener('click', () => switchTab(tab.dataset.tab)));

        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.trim();
            const activeTab = document.querySelector('.tab-btn.active').dataset.tab;
            renderCards(activeTab, `${activeTab}-grid`, term);
        });

        window.addEventListener('scroll', () => {
            scrollTopBtn.classList.toggle('visible', window.scrollY > 400);
        });

        scrollTopBtn.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        function showToast(message) {
            toastMessage.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            ['plugins', 'modules', 'bots', 'apps'].forEach(cat => {
                renderCards(cat, `${cat}-grid`);
            });
        });

        // Easter Egg
        let clickCount = 0;
        document.getElementById('main-title').addEventListener('click', () => {
            clickCount++;
            if (clickCount === 7) {
                showToast('Секретный режим активирован! 🌈');
                document.body.style.transition = 'filter 1s ease';
                document.body.style.filter = 'hue-rotate(90deg) saturate(1.5)';
                setTimeout(() => {
                    document.body.style.filter = 'none';
                }, 5000);
                clickCount = 0;
            }
        });
    </script>
</body>
</html>
