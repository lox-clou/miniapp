<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Premium Liquid Glass Catalog</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 🌑 ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ LIQUID GLASS */
        :root {
            --bg-deep: #050507;
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --neon-cyan: #00f2ff;
            --neon-purple: #bd00ff;
            --neon-red: #ff0055;
            
            /* Формула идеального стекла */
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-highlight: rgba(255, 255, 255, 0.15);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            --blur-amount: blur(24px) saturate(180%);
        }

        * { 
            margin: 0; padding: 0; box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif; 
        }
        
        body { 
            background: var(--bg-deep); 
            color: var(--text-primary); 
            min-height: 100vh; 
            overflow-x: hidden; 
            padding-bottom: 40px; 
        }

        /* 🌌 ЖИВОЙ ФОН (Плавающие сферы) */
        .ambient-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; overflow: hidden; background: var(--bg-deep);
        }
        .orb {
            position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.4;
            animation: floatOrb 20s ease-in-out infinite alternate;
        }
        .orb-1 { width: 400px; height: 400px; background: var(--neon-cyan); top: -10%; left: -10%; animation-duration: 25s; }
        .orb-2 { width: 350px; height: 350px; background: var(--neon-purple); bottom: -10%; right: -10%; animation-duration: 30s; animation-direction: reverse; }
        .orb-3 { width: 250px; height: 250px; background: var(--neon-red); top: 40%; left: 30%; opacity: 0.15; animation-duration: 35s; }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -40px) scale(1.1); }
            100% { transform: translate(-20px, 20px) scale(0.95); }
        }

        .app { max-width: 480px; margin: 0 auto; padding: 16px; position: relative; }

        /* 🧊 БАЗОВЫЙ КЛАСС LIQUID GLASS */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: var(--blur-amount);
            -webkit-backdrop-filter: var(--blur-amount);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-highlight);
        }

        /* ЗАГОЛОВОК И СЕКРЕТНАЯ КНОПКА */
        .header { 
            display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 24px; padding-top: 8px; 
        }
        .header h1 { 
            font-size: 32px; font-weight: 800; letter-spacing: -1px; 
            background: linear-gradient(135deg, #fff 0%, #a0a0b0 100%); 
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
        }
        .secret-trigger {
            width: 44px; height: 44px; border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            color: rgba(255, 255, 255, 0.2); font-size: 18px;
        }
        .secret-trigger:hover {
            color: var(--neon-red); border-color: rgba(255, 0, 85, 0.4);
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.3), inset 0 0 10px rgba(255, 0, 85, 0.1);
            transform: rotate(180deg) scale(1.1);
        }
        .secret-trigger:active { transform: scale(0.9); }

        /* ВКЛАДКИ (CHIPS) */
        .tabs { 
            display: flex; gap: 10px; overflow-x: auto; padding-bottom: 16px; margin-bottom: 20px; 
            scrollbar-width: none; 
        }
        .tabs::-webkit-scrollbar { display: none; }
        .tab {
            flex-shrink: 0; padding: 12px 22px; border-radius: 24px;
            color: var(--text-secondary); font-size: 14px; font-weight: 600; 
            cursor: pointer; transition: all 0.3s ease; position: relative; overflow: hidden;
        }
        .tab.active { 
            color: #fff; 
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1), inset 0 1px 0 rgba(255,255,255,0.2);
        }
        .tab:active { transform: scale(0.95); }

        /* ПОИСК */
        .search-box { position: relative; margin-bottom: 24px; border-radius: 20px; padding: 4px; }
        .search-input {
            width: 100%; background: rgba(0, 0, 0, 0.2); border: 1px solid var(--glass-border);
            border-radius: 16px; padding: 16px 16px 16px 50px; color: var(--text-primary);
            font-size: 15px; outline: none; transition: all 0.3s;
        }
        .search-input::placeholder { color: var(--text-secondary); }
        .search-input:focus { 
            border-color: var(--neon-cyan); 
            box-shadow: 0 0 0 4px rgba(0, 242, 255, 0.1), 0 0 20px rgba(0, 242, 255, 0.15); 
            background: rgba(0, 0, 0, 0.4);
        }
        .search-icon { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); transition: color 0.3s; }
        .search-input:focus + .search-icon { color: var(--neon-cyan); }

        /* КАРТОЧКИ (ITEM CARDS) */
        .items-list { display: flex; flex-direction: column; gap: 14px; }
        .item-card {
            border-radius: 24px; padding: 18px; display: flex; align-items: center;
            justify-content: space-between; cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative; overflow: hidden;
        }
        /* Эффект блика при наведении */
        .item-card::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
            transform: skewX(-20deg); transition: left 0.6s ease;
        }
        .item-card:hover::before { left: 150%; }
        .item-card:hover { 
            transform: translateY(-2px); 
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255,255,255,0.2);
        }
        .item-card:active { transform: scale(0.98); }
        
        .item-info { display: flex; align-items: center; gap: 16px; flex: 1; min-width: 0; }
        .item-icon { 
            width: 48px; height: 48px; border-radius: 16px; 
            background: linear-gradient(135deg, rgba(0, 242, 255, 0.1), rgba(189, 0, 255, 0.1)); 
            color: var(--neon-cyan); display: flex; align-items: center; justify-content: center; 
            font-size: 20px; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.1);
            transition: transform 0.3s ease;
        }
        .item-card:hover .item-icon { transform: scale(1.1) rotate(5deg); }
        
        .item-name { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item-desc { font-size: 13px; color: var(--text-secondary); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        /* КНОПКИ ДЕЙСТВИЙ */
        .action-btns { display: flex; gap: 10px; flex-shrink: 0; }
        .icon-btn {
            width: 42px; height: 42px; border-radius: 14px; 
            background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); 
            color: var(--text-secondary); display: flex; align-items: center; justify-content: center; 
            cursor: pointer; transition: all 0.25s ease; font-size: 16px;
        }
        .icon-btn.copy-btn:hover { color: #fff; background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.3); }
        .icon-btn.open-btn { 
            background: linear-gradient(135deg, rgba(0, 242, 255, 0.15), rgba(189, 0, 255, 0.15)); 
            color: var(--neon-cyan); border-color: rgba(0, 242, 255, 0.3); 
        }
        .icon-btn.open-btn:hover { 
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple)); 
            color: #000; border-color: transparent; 
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.4);
        }
        .icon-btn:active { transform: scale(0.85); }

        /* СТРАНИЦЫ И АНИМАЦИИ */
        .view { display: none; }
        .view.active { display: block; }
        
        @keyframes slideUpFade { 
            from { opacity: 0; transform: translateY(20px) scale(0.98); } 
            to { opacity: 1; transform: translateY(0) scale(1); } 
        }
        .animate-in { animation: slideUpFade 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }

        .back-btn {
            display: inline-flex; align-items: center; gap: 8px; color: var(--neon-cyan);
            font-size: 15px; font-weight: 600; margin-bottom: 24px; cursor: pointer;
            padding: 10px 16px; border-radius: 16px; transition: all 0.2s;
            background: rgba(0, 242, 255, 0.05); border: 1px solid rgba(0, 242, 255, 0.2);
        }
        .back-btn:hover { background: rgba(0, 242, 255, 0.1); }
        .back-btn:active { transform: scale(0.95); }

        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
        .empty-state i { font-size: 48px; margin-bottom: 16px; opacity: 0.3; }

        /* СЕКРЕТНАЯ СТРАНИЦА */
        .secret-card {
            border-color: rgba(255, 0, 85, 0.3) !important;
            background: rgba(255, 0, 85, 0.05) !important;
            box-shadow: 0 0 40px rgba(255, 0, 85, 0.15), inset 0 1px 0 rgba(255, 0, 85, 0.2) !important;
        }
        .secret-card .item-icon {
            background: rgba(255, 0, 85, 0.15) !important; color: var(--neon-red) !important;
            border-color: rgba(255, 0, 85, 0.3) !important;
            animation: pulseRed 2s infinite;
        }
        .secret-card .item-name { color: var(--neon-red) !important; }
        .secret-card .icon-btn.open-btn {
            background: linear-gradient(135deg, rgba(255, 0, 85, 0.2), rgba(189, 0, 255, 0.2));
            color: var(--neon-red); border-color: rgba(255, 0, 85, 0.4);
        }
        .secret-card .icon-btn.open-btn:hover {
            background: var(--neon-red); color: #fff; box-shadow: 0 0 25px rgba(255, 0, 85, 0.5);
        }

        @keyframes pulseRed {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 0, 85, 0.4); }
            50% { box-shadow: 0 0 0 10px rgba(255, 0, 85, 0); }
        }

        /* TOAST УВЕДОМЛЕНИЕ */
        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: rgba(10, 10, 15, 0.9); backdrop-filter: blur(20px); color: #fff;
            padding: 14px 28px; border-radius: 30px; font-size: 14px; font-weight: 600;
            opacity: 0; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); z-index: 100;
            border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            display: flex; align-items: center; gap: 10px;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .toast i { color: var(--neon-cyan); }

        /* КАСТОМНЫЙ СКРОЛЛБАР */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
    </style>
</head>
<body>
    <div class="ambient-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>
    
    <div class="app">
        <!-- ГЛАВНЫЙ ЭКРАН -->
        <div id="view-main" class="view active">
            <div class="header animate-in" style="animation-delay: 0.05s;">
                <h1>⚡ Premium</h1>
                <div class="glass secret-trigger" onclick="openSecret()" title="???">
                    <i class="fas fa-fingerprint"></i>
                </div>
            </div>

            <div class="tabs animate-in" style="animation-delay: 0.1s;">
                <div class="glass tab active" onclick="switchTab('plugins', this)">📦 Плагины</div>
                <div class="glass tab" onclick="switchTab('modules', this)">🧩 Модули</div>
                <div class="glass tab" onclick="switchTab('apps', this)">📱 Приложения</div>
            </div>

            <div class="search-box glass animate-in" style="animation-delay: 0.15s;">
                <input type="text" class="search-input" id="searchInput" placeholder="Найти твик или приложение..." oninput="handleSearch(this.value)">
                <i class="fas fa-search search-icon"></i>
            </div>

            <div id="content-list" class="items-list"></div>
        </div>

        <!-- СЕКРЕТНЫЙ ЭКРАН -->
        <div id="view-secret" class="view">
            <div class="back-btn animate-in" onclick="closeSecret()">
                <i class="fas fa-arrow-left"></i> Назад в каталог
            </div>
            <div class="header animate-in" style="animation-delay: 0.1s;">
                <h1 style="background: linear-gradient(135deg, #ff0055, #bd00ff); -webkit-background-clip: text;">🔒 Secret Area</h1>
            </div>
            <div class="items-list">
                <div class="glass item-card secret-card animate-in" style="animation-delay: 0.2s;" onclick="openLink('https://t.me/exterapl/838')">
                    <div class="item-info">
                        <div class="item-icon"><i class="fas fa-skull"></i></div>
                        <div>
                            <div class="item-name">Секретный Плагин</div>
                            <div class="item-desc">Доступ только для избранных</div>
                        </div>
                    </div>
                    <div class="action-btns">
                        <div class="icon-btn open-btn"><i class="fas fa-external-link-alt"></i></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast glass" id="toast">
        <i class="fas fa-check-circle"></i> Ссылка скопирована!
    </div>

    <script>
        const DATA = {
            plugins: [
                { name: "LocalEditor", url: "https://t.me/exteraPluginsSup/221", desc: "Редактирование без пересылки" },
                { name: "Lyrics+", url: "https://t.me/thefantiq/22", desc: "Тексты песен прямо в плеере" },
                { name: "Animated Wallpaper", url: "https://t.me/swagnonher/321", desc: "Живые обои для фона чатов" },
                { name: "reSwaga", url: "https://t.me/meeowPlugins/213", desc: "Карточки и треки со всех площадок" },
                { name: "re:extera", url: "https://t.me/shikaatuxplugins/224", desc: "Расширенные настройки Extera" },
                { name: "Quotify+", url: "https://t.me/mur_live/1537", desc: "Создание красивых цитат" },
                { name: "Fake Gifts", url: "https://t.me/vcvk1/1365", desc: "NFT юзернеймы, номера и подарки" },
                { name: "miniPlayer+", url: "https://t.me/RnPlugins/1083", desc: "Продвинутый мини-плеер" },
                { name: "Hide link preview fork", url: "https://t.me/kchemniy_modules/125", desc: "Скрытие предпросмотра ссылок" },
                { name: "UITweaks x QuantaHut", url: "https://t.me/QuantaPlugins/210", desc: "Глубокая кастомизация интерфейса" },
                { name: "Log overlay", url: "https://t.me/RnPlugins/620", desc: "Отображение логов поверх экрана" },
                { name: "Transcriber fork", url: "https://t.me/kchemniy_modules/12", desc: "Расшифровка голосовых в текст" },
                { name: "Bot login", url: "https://t.me/kvucoPlugins/54", desc: "Удобный вход через ботов" }
            ],
            modules: [
                { name: "Source trigger", url: "https://t.me/RnPlugins/1097", desc: "Триггеры на сообщения" },
                { name: "Giveaway joiner", url: "https://t.me/kchemi_projects/142", desc: "Авто-участие в розыгрышах" },
                { name: "Module list", url: "https://t.me/kchemi_projects/207", desc: "Управление списком модулей" }
            ],
            apps: [
                { name: "TikTok You v3.4", url: "https://t.me/tiktokyou/49", desc: "Модифицированный клиент TikTok" },
                { name: "Wallify", url: "https://t.me/WallifyApp/4/1993", desc: "Красивые живые обои на телефон" },
                { name: "Larpkeeper", url: "https://t.me/vcvk1/1406", desc: "Фейковый Tonkeeper" }
            ]
        };

        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
        // Делаем хедер Telegram черным для бесшовного слияния
        tg.setHeaderColor('#050507'); 
        tg.setBackgroundColor('#050507');
        
        const haptic = (type = 'light') => tg.HapticFeedback?.impactOccurred(type);

        let state = { activeTab: 'plugins', searchQuery: '' };

        function switchTab(tab, element) {
            haptic('medium');
            state.activeTab = tab;
            state.searchQuery = '';
            document.getElementById('searchInput').value = '';
            
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            element.classList.add('active');
            renderList();
        }

        function handleSearch(query) {
            haptic('light');
            state.searchQuery = query.toLowerCase().trim();
            renderList();
        }

        function renderList() {
            const list = document.getElementById('content-list');
            list.innerHTML = '';
            
            let itemsToRender = [];
            if (state.searchQuery) {
                Object.values(DATA).flat().forEach(item => {
                    if (item.name.toLowerCase().includes(state.searchQuery) || item.desc.toLowerCase().includes(state.searchQuery)) {
                        itemsToRender.push(item);
                    }
                });
            } else {
                itemsToRender = DATA[state.activeTab] || [];
            }

            if (itemsToRender.length === 0) {
                list.innerHTML = `<div class="glass empty-state animate-in"><i class="fas fa-ghost"></i><br>Ничего не найдено</div>`;
                return;
            }

            itemsToRender.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'glass item-card animate-in';
                div.style.animationDelay = `${index * 0.06}s`; // Каскадная анимация
                
                let displayName = item.name;
                if (state.searchQuery) {
                    const regex = new RegExp(`(${state.searchQuery})`, 'gi');
                    displayName = item.name.replace(regex, '<span style="color: var(--neon-cyan); font-weight: 700;">$1</span>');
                }

                div.innerHTML = `
                    <div class="item-info" onclick="openLink('${item.url}')">
                        <div class="item-icon"><i class="fas fa-bolt"></i></div>
                        <div style="flex:1; min-width:0;">
                            <div class="item-name">${displayName}</div>
                            <div class="item-desc">${item.desc}</div>
                        </div>
                    </div>
                    <div class="action-btns">
                        <div class="icon-btn copy-btn" onclick="copyLink('${item.url}', event)" title="Копировать">
                            <i class="fas fa-copy"></i>
                        </div>
                        <div class="icon-btn open-btn" onclick="openLink('${item.url}')" title="Открыть">
                            <i class="fas fa-external-link-alt"></i>
                        </div>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        function openLink(url) {
            haptic('heavy');
            tg.openTelegramLink(url);
        }

        function copyLink(url, event) {
            event.stopPropagation();
            haptic('medium');
            navigator.clipboard.writeText(url).then(() => showToast());
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function openSecret() {
            haptic('heavy');
            document.getElementById('view-main').classList.remove('active');
            document.getElementById('view-secret').classList.add('active');
            tg.BackButton.show();
            tg.BackButton.onClick(closeSecret);
        }

        function closeSecret() {
            haptic('medium');
            document.getElementById('view-secret').classList.remove('active');
            document.getElementById('view-main').classList.add('active');
            tg.BackButton.hide();
        }

        // Первичный рендер
        renderList();
    </script>
</body>
</html>
