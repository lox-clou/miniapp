<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Premium Dark Catalog</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 🌑 ПРИНУДИТЕЛЬНАЯ ТЕМНАЯ ТЕМА (Игнорируем настройки Telegram) */
        :root {
            --bg: #000000;
            --text: #ffffff;
            --hint: #888888;
            --accent: #00f2ff; /* Неоновый голубой */
            --accent-2: #bd00ff; /* Неоновый фиолетовый */
            --card-bg: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
            --glass-blur: blur(20px) saturate(180%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif; }
        
        body { 
            background: var(--bg); 
            color: var(--text); 
            min-height: 100vh; 
            overflow-x: hidden; 
            padding-bottom: 40px; 
        }

        /* 🌌 Анимированный фон "Жидкий неон" */
        .mesh-bg {
            position: fixed; top: -50%; left: -50%; width: 200%; height: 200%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(0, 242, 255, 0.15), transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(189, 0, 255, 0.15), transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.03), transparent 60%);
            z-index: -1; 
            animation: meshMove 15s ease-in-out infinite alternate;
            filter: blur(40px);
        }
        @keyframes meshMove { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(-5%, -5%) scale(1.1); } }

        .app { max-width: 480px; margin: 0 auto; padding: 16px; position: relative; }

        /* Заголовок с секретной кнопкой */
        .header { 
            display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 24px; padding-top: 10px; 
        }
        .header h1 { 
            font-size: 28px; font-weight: 800; letter-spacing: -1px; 
            background: linear-gradient(135deg, #fff 0%, #aaa 100%); 
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
        }
        
        /* 🔮 Секретный декоративный значок */
        .secret-trigger {
            width: 40px; height: 40px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.4s ease;
            color: rgba(255, 255, 255, 0.2); font-size: 16px;
        }
        .secret-trigger:hover {
            color: var(--accent);
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.4);
            transform: rotate(180deg) scale(1.1);
        }
        .secret-trigger:active { transform: scale(0.9); }

        /* Вкладки */
        .tabs { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 16px; margin-bottom: 16px; scrollbar-width: none; }
        .tabs::-webkit-scrollbar { display: none; }
        .tab {
            flex-shrink: 0; padding: 10px 20px; border-radius: 24px;
            background: var(--card-bg); border: 1px solid var(--border);
            color: var(--hint); font-size: 14px; font-weight: 600; cursor: pointer;
            backdrop-filter: var(--glass-blur); transition: all 0.3s ease;
        }
        .tab.active { 
            background: rgba(255, 255, 255, 0.1); 
            color: #fff; border-color: rgba(255, 255, 255, 0.3); 
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        }
        .tab:active { transform: scale(0.95); }

        /* Поиск */
        .search-box { position: relative; margin-bottom: 24px; }
        .search-input {
            width: 100%; background: var(--card-bg); border: 1px solid var(--border);
            border-radius: 20px; padding: 16px 16px 16px 48px; color: var(--text);
            font-size: 15px; outline: none; transition: all 0.3s; backdrop-filter: var(--glass-blur);
        }
        .search-input:focus { 
            border-color: var(--accent); 
            box-shadow: 0 0 0 4px rgba(0, 242, 255, 0.1), 0 0 20px rgba(0, 242, 255, 0.2); 
        }
        .search-icon { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--hint); }

        /* Карточки (Liquid Glass) */
        .items-list { display: flex; flex-direction: column; gap: 12px; }
        .item-card {
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: 24px; padding: 18px; display: flex; align-items: center;
            justify-content: space-between; cursor: pointer; 
            backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative; overflow: hidden;
        }
        /* Эффект свечения при наведении/нажатии */
        .item-card::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            transition: left 0.5s;
        }
        .item-card:hover::before { left: 100%; }
        .item-card:active { transform: scale(0.98); border-color: rgba(255,255,255,0.2); }
        
        .item-info { display: flex; align-items: center; gap: 16px; flex: 1; min-width: 0; }
        .item-icon { 
            width: 44px; height: 44px; border-radius: 14px; 
            background: linear-gradient(135deg, rgba(0, 242, 255, 0.1), rgba(189, 0, 255, 0.1)); 
            color: var(--accent); display: flex; align-items: center; justify-content: center; 
            font-size: 18px; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.05);
        }
        .item-name { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item-desc { font-size: 13px; color: var(--hint); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .action-btns { display: flex; gap: 10px; }
        .icon-btn {
            width: 40px; height: 40px; border-radius: 14px; background: rgba(255,255,255,0.05);
            border: 1px solid var(--border); color: var(--hint); display: flex; align-items: center;
            justify-content: center; cursor: pointer; transition: all 0.2s; font-size: 15px;
        }
        .icon-btn:active { transform: scale(0.9); background: var(--accent); color: #000; border-color: var(--accent); }
        .icon-btn.open { background: var(--accent); color: #000; border-color: var(--accent); box-shadow: 0 0 15px rgba(0, 242, 255, 0.3); }

        /* Секретная страница */
        .view { display: none; }
        .view.active { display: block; animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .back-btn {
            display: inline-flex; align-items: center; gap: 8px; color: var(--accent);
            font-size: 15px; font-weight: 600; margin-bottom: 24px; cursor: pointer;
            padding: 10px 0; transition: opacity 0.2s;
        }
        .back-btn:active { opacity: 0.6; }

        .empty-state { text-align: center; padding: 50px 20px; color: var(--hint); }
        .empty-state i { font-size: 48px; margin-bottom: 16px; opacity: 0.3; }

        /* Уведомление */
        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: rgba(20, 20, 20, 0.9); backdrop-filter: blur(10px); color: #fff;
            padding: 14px 28px; border-radius: 30px; font-size: 14px; font-weight: 600;
            opacity: 0; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); z-index: 100;
            border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>
<body>
    <div class="mesh-bg"></div>
    
    <div class="app">
        <!-- ГЛАВНЫЙ ЭКРАН -->
        <div id="view-main" class="view active">
            <div class="header">
                <h1>⚡ Premium</h1>
                <!-- 🔮 Секретный декоративный значок -->
                <div class="secret-trigger" onclick="openSecret()" title="???">
                    <i class="fas fa-gem"></i>
                </div>
            </div>

            <div class="tabs">
                <div class="tab active" onclick="switchTab('plugins', this)">📦 Плагины</div>
                <div class="tab" onclick="switchTab('modules', this)">🧩 Модули</div>
                <div class="tab" onclick="switchTab('apps', this)">📱 Приложения</div>
            </div>

            <div class="search-box">
                <i class="fas fa-search search-icon"></i>
                <input type="text" class="search-input" id="searchInput" placeholder="Поиск по всему каталогу..." oninput="handleSearch(this.value)">
            </div>

            <div id="content-list" class="items-list"></div>
        </div>

        <!-- 🔒 СЕКРЕТНЫЙ ЭКРАН -->
        <div id="view-secret" class="view">
            <div class="back-btn" onclick="closeSecret()"><i class="fas fa-arrow-left"></i> Назад в каталог</div>
            <div class="header">
                <h1>🔒 Secret Area</h1>
            </div>
            <div class="items-list">
                <div class="item-card" style="border-color: rgba(255, 0, 85, 0.3); box-shadow: 0 0 30px rgba(255, 0, 85, 0.1);" onclick="openLink('https://t.me/exterapl/838')">
                    <div class="item-info">
                        <div class="item-icon" style="background: rgba(255, 0, 85, 0.15); color: #ff0055; border-color: rgba(255, 0, 85, 0.3);">
                            <i class="fas fa-skull"></i>
                        </div>
                        <div>
                            <div class="item-name" style="color: #ff0055;">Секретный Плагин</div>
                            <div class="item-desc">Доступ только для избранных</div>
                        </div>
                    </div>
                    <div class="action-btns">
                        <div class="icon-btn open"><i class="fas fa-external-link-alt"></i></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">✅ Ссылка скопирована!</div>

    <script>
        const DATA = {
            plugins: [
                { name: "LocalEditor", url: "https://t.me/exteraPluginsSup/221", desc: "Редактирование без пересылки" },
                { name: "Lyrics+", url: "https://t.me/thefantiq/22", desc: "Тексты песен прямо в плеере" },
                { name: "Animated Wallpaper", url: "https://t.me/swagnonher/321", desc: "Живые обои для фона чатов" },
                { name: "reSwaga", url: "https://t.me/meeowPlugins/213", desc: "Карточки и треки со всех площадок" },
                { name: "re:extera", url: "https://t.me/shikaatuxplugins/224", desc: "Расширенные настройки Extera" },
                { name: "Quotify+", url: "https://t.me/mur_live/1537", desc: "Создание красивых цитат" },
                { name: "Fake Gifts", url: "https://t.me/vcvk1/1365", desc: "NFT юзернеймы, номера и подарки" },
                { name: "miniPlayer+", url: "https://t.me/RnPlugins/1083", desc: "Продвинутый мини-плеер" },
                { name: "Hide link preview fork", url: "https://t.me/kchemniy_modules/125", desc: "Скрытие предпросмотра ссылок" },
                { name: "UITweaks x QuantaHut", url: "https://t.me/QuantaPlugins/210", desc: "Глубокая кастомизация интерфейса" },
                { name: "Log overlay", url: "https://t.me/RnPlugins/620", desc: "Отображение логов поверх экрана" },
                { name: "Transcriber fork", url: "https://t.me/kchemniy_modules/12", desc: "Расшифровка голосовых в текст" },
                { name: "Bot login", url: "https://t.me/kvucoPlugins/54", desc: "Удобный вход через ботов" }
            ],
            modules: [
                { name: "Source trigger", url: "https://t.me/RnPlugins/1097", desc: "Триггеры на сообщения" },
                { name: "Giveaway joiner", url: "https://t.me/kchemi_projects/142", desc: "Авто-участие в розыгрышах" },
                { name: "Module list", url: "https://t.me/kchemi_projects/207", desc: "Управление списком модулей" }
            ],
            apps: [
                { name: "TikTok You v3.4", url: "https://t.me/tiktokyou/49", desc: "Модифицированный клиент TikTok" },
                { name: "Wallify", url: "https://t.me/WallifyApp/4/1993", desc: "Красивые живые обои на телефон" },
                { name: "Larpkeeper", url: "https://t.me/vcvk1/1406", desc: "Фейковый Tonkeeper" }
            ]
        };

        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
        
        const haptic = (type = 'light') => tg.HapticFeedback?.impactOccurred(type);

        let state = { activeTab: 'plugins', searchQuery: '' };

        function switchTab(tab, element) {
            haptic('medium');
            state.activeTab = tab;
            state.searchQuery = '';
            document.getElementById('searchInput').value = '';
            
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            element.classList.add('active');
            renderList();
        }

        function handleSearch(query) {
            haptic('light');
            state.searchQuery = query.toLowerCase().trim();
            renderList();
        }

        function renderList() {
            const list = document.getElementById('content-list');
            list.innerHTML = '';
            
            let itemsToRender = [];
            if (state.searchQuery) {
                Object.values(DATA).flat().forEach(item => {
                    if (item.name.toLowerCase().includes(state.searchQuery) || item.desc.toLowerCase().includes(state.searchQuery)) {
                        itemsToRender.push(item);
                    }
                });
            } else {
                itemsToRender = DATA[state.activeTab] || [];
            }

            if (itemsToRender.length === 0) {
                list.innerHTML = `<div class="empty-state"><i class="fas fa-ghost"></i><br>Ничего не найдено</div>`;
                return;
            }

            itemsToRender.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'item-card';
                div.style.animation = `fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards`;
                div.style.animationDelay = `${index * 0.05}s`;
                div.style.opacity = '0'; // Для анимации
                
                let displayName = item.name;
                if (state.searchQuery) {
                    const regex = new RegExp(`(${state.searchQuery})`, 'gi');
                    displayName = item.name.replace(regex, '<span style="color: var(--accent); font-weight: 700;">$1</span>');
                }

                div.innerHTML = `
                    <div class="item-info" onclick="openLink('${item.url}')">
                        <div class="item-icon"><i class="fas fa-bolt"></i></div>
                        <div style="flex:1; min-width:0;">
                            <div class="item-name">${displayName}</div>
                            <div class="item-desc">${item.desc}</div>
                        </div>
                    </div>
                    <div class="action-btns">
                        <div class="icon-btn" onclick="copyLink('${item.url}', event)"><i class="fas fa-copy"></i></div>
                        <div class="icon-btn open" onclick="openLink('${item.url}')"><i class="fas fa-external-link-alt"></i></div>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        function openLink(url) {
            haptic('heavy');
            tg.openTelegramLink(url);
        }

        function copyLink(url, event) {
            event.stopPropagation();
            haptic('medium');
            navigator.clipboard.writeText(url).then(() => showToast());
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // 🔮 Логика секретной страницы
        function openSecret() {
            haptic('heavy');
            document.getElementById('view-main').classList.remove('active');
            document.getElementById('view-secret').classList.add('active');
            tg.BackButton.show();
            tg.BackButton.onClick(closeSecret);
        }

        function closeSecret() {
            haptic('medium');
            document.getElementById('view-secret').classList.remove('active');
            document.getElementById('view-main').classList.add('active');
            tg.BackButton.hide();
        }

        // Первичный рендер
        renderList();
    </script>
</body>
</html>
