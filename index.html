<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Premium Catalog</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-deep: #030305;
            --text-primary: #ffffff;
            --text-secondary: #8b8b9e;
            --accent: #00f2ff;
            --accent-glow: rgba(0, 242, 255, 0.15);
            --secret: #ff0055;
            
            --glass-bg: rgba(20, 20, 25, 0.6);
            --glass-border: rgba(255, 255, 255, 0.06);
            --glass-highlight: rgba(255, 255, 255, 0.1);
            --blur: blur(20px) saturate(150%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif; }
        
        body { background: var(--bg-deep); color: var(--text-primary); min-height: 100vh; overflow-x: hidden; padding-bottom: 40px; }

        /* 🌌 Глубокий анимированный фон */
        .ambient-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; overflow: hidden; background: var(--bg-deep); }
        .orb { position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.3; animation: float 25s ease-in-out infinite alternate; }
        .orb-1 { width: 500px; height: 500px; background: radial-gradient(circle, var(--accent), transparent 70%); top: -20%; left: -20%; }
        .orb-2 { width: 400px; height: 400px; background: radial-gradient(circle, #bd00ff, transparent 70%); bottom: -10%; right: -10%; animation-direction: reverse; }

        @keyframes float { 0% { transform: translate(0, 0); } 100% { transform: translate(40px, -40px); } }

        .app { max-width: 480px; margin: 0 auto; padding: 20px 16px; position: relative; }

        /* 🧊 Premium Glass Component */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border: 1px solid var(--glass-border);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
        }

        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; padding-top: 8px; }
        .header h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; background: linear-gradient(to right, #fff, #a0a0b0); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .secret-trigger {
            width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); color: rgba(255,255,255,0.1); font-size: 16px;
        }
        .secret-trigger:hover { color: var(--secret); background: rgba(255, 0, 85, 0.1); box-shadow: 0 0 20px rgba(255, 0, 85, 0.2); transform: scale(1.1); }
        .secret-trigger:active { transform: scale(0.9); }

        /* Tabs */
        .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 20px; scrollbar-width: none; }
        .tabs::-webkit-scrollbar { display: none; }
        .tab {
            flex-shrink: 0; padding: 10px 18px; border-radius: 100px; color: var(--text-secondary); font-size: 14px; font-weight: 600;
            cursor: pointer; transition: all 0.3s ease; border: 1px solid transparent;
        }
        .tab.active { color: #fff; background: rgba(255, 255, 255, 0.1); border-color: var(--glass-highlight); box-shadow: 0 0 15px rgba(255,255,255,0.05); }
        .tab:active { transform: scale(0.95); }

        /* Search */
        .search-box { position: relative; margin-bottom: 24px; border-radius: 16px; padding: 2px; }
        .search-input {
            width: 100%; background: rgba(0, 0, 0, 0.3); border: 1px solid var(--glass-border); border-radius: 14px;
            padding: 14px 16px 14px 46px; color: var(--text-primary); font-size: 15px; outline: none; transition: all 0.3s;
        }
        .search-input::placeholder { color: var(--text-secondary); }
        .search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); background: rgba(0, 0, 0, 0.5); }
        .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); transition: color 0.3s; }
        .search-input:focus ~ .search-icon { color: var(--accent); }

        /* List & Cards */
        .items-list { display: flex; flex-direction: column; gap: 12px; min-height: 200px; }
        .item-card {
            border-radius: 18px; padding: 16px; display: flex; align-items: center; justify-content: space-between;
            cursor: pointer; transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); position: relative; overflow: hidden;
        }
        .item-card:hover { transform: translateY(-2px); border-color: rgba(255,255,255,0.15); box-shadow: 0 8px 30px rgba(0,0,0,0.5); }
        .item-card:active { transform: scale(0.98); }
        
        .item-info { display: flex; align-items: center; gap: 14px; flex: 1; min-width: 0; }
        .item-icon {
            width: 44px; height: 44px; border-radius: 12px; background: rgba(255,255,255,0.03);
            color: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.05); transition: transform 0.3s ease;
        }
        .item-card:hover .item-icon { transform: scale(1.1); background: rgba(255,255,255,0.06); }
        
        .item-name { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item-desc { font-size: 13px; color: var(--text-secondary); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .action-btns { display: flex; gap: 8px; flex-shrink: 0; }
        .icon-btn {
            width: 38px; height: 38px; border-radius: 12px; background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border);
            color: var(--text-secondary); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; font-size: 14px;
        }
        .icon-btn:hover { color: #fff; background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2); }
        .icon-btn.open-btn { background: var(--accent); color: #000; border-color: var(--accent); box-shadow: 0 4px 15px var(--accent-glow); }
        .icon-btn.open-btn:hover { background: #fff; box-shadow: 0 4px 20px rgba(255,255,255,0.3); }
        .icon-btn:active { transform: scale(0.9); }

        /* Pagination */
        .pagination {
            display: flex; align-items: center; justify-content: center; gap: 16px; margin-top: 24px;
            padding: 12px; border-radius: 16px; opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .pagination.visible { opacity: 1; pointer-events: all; }
        .page-btn {
            width: 36px; height: 36px; border-radius: 10px; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);
            color: var(--text-primary); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s;
        }
        .page-btn:hover:not(:disabled) { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2); }
        .page-btn:active:not(:disabled) { transform: scale(0.9); }
        .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .page-info { font-size: 14px; font-weight: 600; color: var(--text-secondary); min-width: 60px; text-align: center; }

        /* Views & Animations */
        .view { display: none; }
        .view.active { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }

        .back-btn {
            display: inline-flex; align-items: center; gap: 8px; color: var(--accent); font-size: 14px; font-weight: 600;
            margin-bottom: 24px; cursor: pointer; padding: 10px 16px; border-radius: 12px; transition: all 0.2s;
            background: rgba(0, 242, 255, 0.05); border: 1px solid rgba(0, 242, 255, 0.15);
        }
        .back-btn:hover { background: rgba(0, 242, 255, 0.1); }
        .back-btn:active { transform: scale(0.96); }

        .empty-state { text-align: center; padding: 50px 20px; color: var(--text-secondary); }
        .empty-state i { font-size: 40px; margin-bottom: 12px; opacity: 0.3; }

        /* Secret Card */
        .secret-card { border-color: rgba(255, 0, 85, 0.3) !important; background: rgba(255, 0, 85, 0.05) !important; }
        .secret-card .item-icon { color: var(--secret) !important; border-color: rgba(255, 0, 85, 0.2) !important; animation: pulse 2s infinite; }
        .secret-card .item-name { color: var(--secret) !important; }
        .secret-card .icon-btn.open-btn { background: var(--secret); color: #fff; border-color: var(--secret); box-shadow: 0 4px 15px rgba(255, 0, 85, 0.3); }
        .secret-card .icon-btn.open-btn:hover { background: #ff3377; }
        @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(255, 0, 85, 0.4); } 50% { box-shadow: 0 0 0 8px rgba(255, 0, 85, 0); } }

        /* Toast */
        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: rgba(10, 10, 15, 0.9); backdrop-filter: blur(20px); color: #fff;
            padding: 12px 24px; border-radius: 100px; font-size: 14px; font-weight: 600;
            opacity: 0; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); z-index: 100;
            border: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: 10px;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .toast i { color: var(--accent); }
    </style>
</head>
<body>
    <div class="ambient-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>
    
    <div class="app">
        <!-- MAIN VIEW -->
        <div id="view-main" class="view active">
            <div class="header animate-in" style="animation-delay: 0.05s;">
                <h1>⚡ Premium</h1>
                <div class="glass secret-trigger" onclick="openSecret()" title="???">
                    <i class="fas fa-fingerprint"></i>
                </div>
            </div>

            <div class="tabs animate-in" style="animation-delay: 0.1s;">
                <div class="glass tab active" onclick="switchTab('plugins', this)">📦 Плагины</div>
                <div class="glass tab" onclick="switchTab('modules', this)">🧩 Модули</div>
                <div class="glass tab" onclick="switchTab('apps', this)">📱 Приложения</div>
            </div>

            <div class="search-box glass animate-in" style="animation-delay: 0.15s;">
                <input type="text" class="search-input" id="searchInput" placeholder="Поиск..." oninput="handleSearch(this.value)">
                <i class="fas fa-search search-icon"></i>
            </div>

            <div id="content-list" class="items-list"></div>
            
            <!-- PAGINATION -->
            <div class="glass pagination" id="pagination">
                <button class="page-btn" id="prevBtn" onclick="changePage(-1)"><i class="fas fa-chevron-left"></i></button>
                <span class="page-info" id="pageInfo">1 / 1</span>
                <button class="page-btn" id="nextBtn" onclick="changePage(1)"><i class="fas fa-chevron-right"></i></button>
            </div>
        </div>

        <!-- SECRET VIEW -->
        <div id="view-secret" class="view">
            <div class="back-btn animate-in" onclick="closeSecret()"><i class="fas fa-arrow-left"></i> Назад</div>
            <div class="header animate-in" style="animation-delay: 0.1s;">
                <h1 style="background: linear-gradient(to right, var(--secret), #bd00ff); -webkit-background-clip: text;">🔒 Secret</h1>
            </div>
            <div class="items-list">
                <div class="glass item-card secret-card animate-in" style="animation-delay: 0.2s;" onclick="openLink('https://t.me/exterapl/838')">
                    <div class="item-info">
                        <div class="item-icon"><i class="fas fa-skull"></i></div>
                        <div>
                            <div class="item-name">Секретный Плагин</div>
                            <div class="item-desc">Доступ только для избранных</div>
                        </div>
                    </div>
                    <div class="action-btns">
                        <div class="icon-btn open-btn"><i class="fas fa-external-link-alt"></i></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast glass" id="toast"><i class="fas fa-check-circle"></i> Скопировано!</div>

    <script>
        const DATA = {
            plugins: [
                { name: "LocalEditor", url: "https://t.me/exteraPluginsSup/221", desc: "Редактирование без пересылки" },
                { name: "Lyrics+", url: "https://t.me/thefantiq/22", desc: "Тексты песен прямо в плеере" },
                { name: "Animated Wallpaper", url: "https://t.me/swagnonher/321", desc: "Живые обои для фона чатов" },
                { name: "reSwaga", url: "https://t.me/meeowPlugins/213", desc: "Карточки и треки со всех площадок" },
                { name: "re:extera", url: "https://t.me/shikaatuxplugins/224", desc: "Расширенные настройки Extera" },
                { name: "Quotify+", url: "https://t.me/mur_live/1537", desc: "Создание красивых цитат" },
                { name: "Fake Gifts", url: "https://t.me/vcvk1/1365", desc: "NFT юзернеймы, номера и подарки" },
                { name: "miniPlayer+", url: "https://t.me/RnPlugins/1083", desc: "Продвинутый мини-плеер" },
                { name: "Hide link preview fork", url: "https://t.me/kchemniy_modules/125", desc: "Скрытие предпросмотра ссылок" },
                { name: "UITweaks x QuantaHut", url: "https://t.me/QuantaPlugins/210", desc: "Глубокая кастомизация интерфейса" },
                { name: "Log overlay", url: "https://t.me/RnPlugins/620", desc: "Отображение логов поверх экрана" },
                { name: "Transcriber fork", url: "https://t.me/kchemniy_modules/12", desc: "Расшифровка голосовых в текст" },
                { name: "Bot login", url: "https://t.me/kvucoPlugins/54", desc: "Удобный вход через ботов" }
            ],
            modules: [
                { name: "Source trigger", url: "https://t.me/RnPlugins/1097", desc: "Триггеры на сообщения" },
                { name: "Giveaway joiner", url: "https://t.me/kchemi_projects/142", desc: "Авто-участие в розыгрышах" },
                { name: "Module list", url: "https://t.me/kchemi_projects/207", desc: "Управление списком модулей" }
            ],
            apps: [
                { name: "TikTok You v3.4", url: "https://t.me/tiktokyou/49", desc: "Модифицированный клиент TikTok" },
                { name: "Wallify", url: "https://t.me/WallifyApp/4/1993", desc: "Красивые живые обои на телефон" },
                { name: "Larpkeeper", url: "https://t.me/vcvk1/1406", desc: "Фейковый Tonkeeper" }
            ]
        };

        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
        tg.setHeaderColor('#030305');
        tg.setBackgroundColor('#030305');
        
        const haptic = (type = 'light') => tg.HapticFeedback?.impactOccurred(type);

        let state = { 
            activeTab: 'plugins', 
            searchQuery: '', 
            currentPage: 1, 
            itemsPerPage: 5 
        };

        function getFilteredItems() {
            if (state.searchQuery) {
                return Object.values(DATA).flat().filter(item => 
                    item.name.toLowerCase().includes(state.searchQuery) || 
                    item.desc.toLowerCase().includes(state.searchQuery)
                );
            }
            return DATA[state.activeTab] || [];
        }

        function switchTab(tab, element) {
            haptic('medium');
            state.activeTab = tab;
            state.searchQuery = '';
            state.currentPage = 1;
            document.getElementById('searchInput').value = '';
            
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            element.classList.add('active');
            renderList();
        }

        function handleSearch(query) {
            haptic('light');
            state.searchQuery = query.toLowerCase().trim();
            state.currentPage = 1; // Сброс на первую страницу при поиске
            renderList();
        }

        function changePage(direction) {
            haptic('light');
            const filtered = getFilteredItems();
            const totalPages = Math.ceil(filtered.length / state.itemsPerPage) || 1;
            const newPage = state.currentPage + direction;
            
            if (newPage >= 1 && newPage <= totalPages) {
                state.currentPage = newPage;
                renderList();
                // Плавный скролл к началу списка
                document.getElementById('content-list').scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        function renderList() {
            const list = document.getElementById('content-list');
            const pagination = document.getElementById('pagination');
            const filtered = getFilteredItems();
            
            const totalPages = Math.ceil(filtered.length / state.itemsPerPage) || 1;
            if (state.currentPage > totalPages) state.currentPage = 1;

            // Управление видимостью пагинации
            if (totalPages > 1) {
                pagination.classList.add('visible');
                document.getElementById('pageInfo').textContent = `${state.currentPage} / ${totalPages}`;
                document.getElementById('prevBtn').disabled = state.currentPage === 1;
                document.getElementById('nextBtn').disabled = state.currentPage === totalPages;
            } else {
                pagination.classList.remove('visible');
            }

            list.innerHTML = '';
            
            if (filtered.length === 0) {
                list.innerHTML = `<div class="glass empty-state animate-in"><i class="fas fa-ghost"></i><br>Ничего не найдено</div>`;
                return;
            }

            const start = (state.currentPage - 1) * state.itemsPerPage;
            const end = start + state.itemsPerPage;
            const pageItems = filtered.slice(start, end);

            pageItems.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'glass item-card animate-in';
                div.style.animationDelay = `${index * 0.05}s`; // Каскадная анимация
                
                let displayName = item.name;
                if (state.searchQuery) {
                    const regex = new RegExp(`(${state.searchQuery})`, 'gi');
                    displayName = item.name.replace(regex, '<span style="color: var(--accent); font-weight: 700;">$1</span>');
                }

                div.innerHTML = `
                    <div class="item-info" onclick="openLink('${item.url}')">
                        <div class="item-icon"><i class="fas fa-bolt"></i></div>
                        <div style="flex:1; min-width:0;">
                            <div class="item-name">${displayName}</div>
                            <div class="item-desc">${item.desc}</div>
                        </div>
                    </div>
                    <div class="action-btns">
                        <div class="icon-btn" onclick="copyLink('${item.url}', event)" title="Копировать">
                            <i class="fas fa-copy"></i>
                        </div>
                        <div class="icon-btn open-btn" onclick="openLink('${item.url}')" title="Открыть">
                            <i class="fas fa-external-link-alt"></i>
                        </div>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        function openLink(url) {
            haptic('heavy');
            tg.openTelegramLink(url);
        }

        function copyLink(url, event) {
            event.stopPropagation();
            haptic('medium');
            navigator.clipboard.writeText(url).then(() => showToast());
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function openSecret() {
            haptic('heavy');
            document.getElementById('view-main').classList.remove('active');
            document.getElementById('view-secret').classList.add('active');
            tg.BackButton.show();
            tg.BackButton.onClick(closeSecret);
        }

        function closeSecret() {
            haptic('medium');
            document.getElementById('view-secret').classList.remove('active');
            document.getElementById('view-main').classList.add('active');
            tg.BackButton.hide();
        }

        // Initial render
        renderList();
    </script>
</body>
</html>
