<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="Каталог лучших плагинов, модулей и приложений для Telegram">
    <meta name="theme-color" content="#050507">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Каталог | Extera Plugins</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #050507;
            --bg-gradient: linear-gradient(135deg, #050507 0%, #0a0a0f 50%, #050507 100%);
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-hover: rgba(255, 255, 255, 0.06);
            --card-active: rgba(255, 255, 255, 0.08);
            --text: #ffffff;
            --text-dim: #8b8b9e;
            --text-bright: #f0f0f5;
            --plugin: #00f2ff;
            --module: #ff9500;
            --app: #ff2d55;
            --bot: #bd00ff;
            --secret: #bd00ff;
            --border: rgba(255, 255, 255, 0.08);
            --border-bright: rgba(255, 255, 255, 0.15);
            --border-glow: rgba(0, 242, 255, 0.3);
            --glow: 0 0 20px;
            --glow-strong: 0 0 40px;
            --skeleton: rgba(255, 255, 255, 0.04);
            --skeleton-shine: rgba(255, 255, 255, 0.08);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.5);
            --shadow-glow: 0 0 30px rgba(0, 242, 255, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Inter', -apple-system, sans-serif; }
        *:focus-visible { outline: 2px solid var(--plugin); outline-offset: 2px; }
        
        body { 
            background: var(--bg); 
            background: var(--bg-gradient);
            color: var(--text); 
            min-height: 100vh; 
            overflow-x: hidden; 
            padding-bottom: 40px; 
        }

        .ambient-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; background: transparent; }
        .aurora {
            position: absolute; width: 150%; height: 150%; top: -25%; left: -25%;
            background: conic-gradient(from 0deg at 50% 50%, transparent 0deg, rgba(0, 242, 255, 0.06) 60deg, transparent 120deg, rgba(255, 45, 85, 0.06) 180deg, transparent 240deg, rgba(189, 0, 255, 0.06) 300deg, transparent 360deg);
            animation: rotate 30s linear infinite; filter: blur(140px); opacity: 0.7;
        }
        .aurora::after {
            content: ''; position: absolute; inset: 0;
            background: conic-gradient(from 180deg at 50% 50%, transparent 0deg, rgba(189, 0, 255, 0.04) 90deg, transparent 180deg, rgba(0, 242, 255, 0.04) 270deg, transparent 360deg);
            animation: rotate 40s linear infinite reverse; filter: blur(120px);
        }
        @keyframes rotate { from { transform: translate(0, 0) rotate(0deg); } to { transform: translate(0, 0) rotate(360deg); } }

        .noise {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.02; pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .app { max-width: 480px; margin: 0 auto; padding: 20px 16px 40px; position: relative; }

        .header { display: flex; justify-content: center; align-items: center; margin-bottom: 32px; padding-top: 8px; position: relative; }
        .header h1 {
            font-size: 15px; font-weight: 900; letter-spacing: 6px; text-transform: uppercase;
            background: linear-gradient(135deg, #fff 0%, var(--plugin) 50%, var(--app) 100%);
            background-size: 200% 200%; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: gradientShift 6s ease infinite; cursor: pointer; user-select: none; transition: transform 0.15s ease, filter 0.3s ease; text-align: center;
            filter: drop-shadow(0 0 20px rgba(0, 242, 255, 0.3));
        }
        .header h1:hover { filter: drop-shadow(0 0 30px rgba(0, 242, 255, 0.5)); }
        .header h1:active { transform: scale(0.92); }
        @keyframes gradientShift { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
        
        .secret-counter {
            position: absolute; top: 50%; right: 0; transform: translateY(-50%); width: 6px; height: 6px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.1); opacity: 0; transition: opacity 0.3s ease; pointer-events: none;
        }
        .secret-counter.visible { opacity: 1; }
        .secret-counter.pulse { animation: counterPulse 0.3s ease; }
        @keyframes counterPulse {
            0%, 100% { transform: translateY(-50%) scale(1); }
            50% { transform: translateY(-50%) scale(2); background: rgba(189, 0, 255, 0.8); box-shadow: 0 0 10px rgba(189, 0, 255, 0.8); }
        }

        .tabs-container { display: flex; align-items: center; gap: 8px; margin-bottom: 24px; }
        .tabs { display: flex; gap: 8px; flex: 1; overflow: hidden; }
        
        .tab {
            flex: 1; padding: 14px 10px; border-radius: 100px; background: var(--card-bg); border: 1px solid var(--border);
            color: var(--text-dim); font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-align: center; white-space: nowrap; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; gap: 6px;
            backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
        }
        .tab.active { 
            color: #fff; background: rgba(255, 255, 255, 0.08); border-color: var(--border-bright); 
            box-shadow: var(--shadow-md), inset 0 1px 0 rgba(255,255,255,0.15);
            transform: translateY(-2px) scale(1.02);
        }
        .tab:active { transform: scale(0.96); }
        .tab-count { font-size: 11px; font-weight: 700; padding: 3px 7px; border-radius: 10px; background: rgba(255, 255, 255, 0.1); color: var(--text-dim); transition: all 0.3s ease; }
        .tab.active .tab-count { background: linear-gradient(135deg, rgba(0, 242, 255, 0.25), rgba(0, 153, 204, 0.2)); color: var(--plugin); box-shadow: 0 0 10px rgba(0, 242, 255, 0.3); }
        
        .tab .ripple, .nav-tab .ripple, .page-btn .ripple, .scroll-top .ripple {
            position: absolute; border-radius: 50%; background: rgba(255, 255, 255, 0.25);
            transform: scale(0); animation: ripple 0.6s linear; pointer-events: none;
        }
        @keyframes ripple { to { transform: scale(4); opacity: 0; } }

        .nav-tab {
            flex-shrink: 0; width: 44px; height: 44px; border-radius: 100px; background: var(--card-bg); border: 1px solid var(--border);
            color: var(--text-dim); display: flex; align-items: center; justify-content: center; cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); font-size: 14px; position: relative; overflow: hidden;
        }
        .nav-tab:hover { 
            color: #fff; 
            background: var(--card-hover); 
            border-color: var(--border-bright); 
            transform: scale(1.1) rotate(5deg); 
        }
        .nav-tab:active { transform: scale(0.95) rotate(0deg); }

        .search-box { position: relative; margin-bottom: 28px; }
        .search-input {
            width: 100%; background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px;
            padding: 18px 50px 18px 55px; color: var(--text); font-size: 15px; outline: none; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        }
        .search-input::placeholder { color: var(--text-dim); }
        .search-input:focus { 
            border-color: var(--plugin); 
            box-shadow: 0 0 0 3px rgba(0, 242, 255, 0.1), var(--glow-strong) rgba(0, 242, 255, 0.2); 
            background: var(--card-hover); 
            transform: translateY(-2px);
        }
        .search-icon { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); color: var(--text-dim); transition: color 0.3s, filter 0.3s; pointer-events: none; font-size: 16px; }
        .search-input:focus ~ .search-icon { color: var(--plugin); filter: drop-shadow(0 0 8px rgba(0, 242, 255, 0.5)); }
        .clear-search {
            position: absolute; right: 18px; top: 50%; transform: translateY(-50%); color: var(--text-dim);
            cursor: pointer; opacity: 0; transition: all 0.2s; pointer-events: none; padding: 8px;
        }
        .clear-search.visible { opacity: 1; pointer-events: all; }
        .clear-search:hover { color: var(--text); transform: translateY(-50%) scale(1.1); }

        .items-list { display: flex; flex-direction: column; gap: 12px; min-height: 200px; transition: opacity 0.3s ease, transform 0.3s ease; opacity: 1; }
        .items-list.fade-out { opacity: 0; transform: translateY(10px); }
        .items-list.fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .skeleton-card {
            background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; padding: 16px;
            display: flex; align-items: center; gap: 16px; position: relative; overflow: hidden;
        }
        .skeleton-card::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, var(--skeleton-shine), transparent);
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer { 100% { left: 100%; } }
        .skeleton-icon { width: 52px; height: 52px; border-radius: 12px; background: var(--skeleton); flex-shrink: 0; }
        .skeleton-text { flex: 1; }
        .skeleton-line { height: 12px; background: var(--skeleton); border-radius: 6px; margin-bottom: 8px; }
        .skeleton-line:last-child { margin-bottom: 0; width: 60%; }
        
        .item-card {
            background: var(--card-bg); 
            border: 1px solid var(--border); 
            border-radius: 20px; 
            padding: 18px;
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); 
            position: relative; 
            overflow: hidden;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .item-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(600px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(255, 255, 255, 0.06), transparent 40%);
            opacity: 0; transition: opacity 0.4s; pointer-events: none;
        }
        .item-card::after {
            content: ''; position: absolute; inset: 0; border-radius: 20px; padding: 1px;
            background: linear-gradient(135deg, rgba(0, 242, 255, 0.2), rgba(189, 0, 255, 0.2));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor; mask-composite: exclude; opacity: 0; transition: opacity 0.4s; pointer-events: none;
        }
        .item-card:hover { 
            transform: translateY(-6px) scale(1.01); 
            border-color: var(--border-bright); 
            box-shadow: var(--shadow-lg), var(--shadow-glow);
            background: var(--card-hover);
        }
        .item-card:hover::before { opacity: 1; }
        .item-card:hover::after { opacity: 1; }
        .item-card:active { transform: translateY(-3px) scale(0.99); }
        
        .item-info { display: flex; align-items: center; gap: 16px; flex: 1; min-width: 0; position: relative; z-index: 1; }
        
        .icon-wrapper {
            width: 52px; height: 52px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
        }
        .icon-svg {
            width: 100%; height: 100%;
            transform: translate(var(--offset-x, 0px), var(--offset-y, 0px));
            transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.3s ease;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.3));
        }
        
        .item-card:hover .icon-wrapper { 
            transform: scale(1.15) rotate(5deg);
        }
        .item-card:hover .plugin-svg { 
            filter: drop-shadow(0 0 15px rgba(0, 242, 255, 0.8)) drop-shadow(0 0 30px rgba(0, 242, 255, 0.4));
            animation: iconPulsePlugin 2s ease-in-out infinite;
        }
        .item-card:hover .module-svg { 
            filter: drop-shadow(0 0 15px rgba(255, 149, 0, 0.8)) drop-shadow(0 0 30px rgba(255, 149, 0, 0.4));
            animation: iconPulseModule 2s ease-in-out infinite;
        }
        .item-card:hover .bot-svg { 
            filter: drop-shadow(0 0 15px rgba(189, 0, 255, 0.8)) drop-shadow(0 0 30px rgba(189, 0, 255, 0.4));
            animation: iconPulseBot 2s ease-in-out infinite;
        }
        .item-card:hover .app-svg { 
            filter: drop-shadow(0 4px 20px rgba(255, 45, 85, 0.7)) drop-shadow(0 0 30px rgba(255, 45, 85, 0.4));
            animation: iconPulseApp 2s ease-in-out infinite;
        }
        
        @keyframes iconPulsePlugin {
            0%, 100% { transform: translate(var(--offset-x, 0px), var(--offset-y, 0px)) scale(1); }
            50% { transform: translate(var(--offset-x, 0px), var(--offset-y, 0px)) scale(1.05); }
        }
        @keyframes iconPulseModule {
            0%, 100% { transform: translate(var(--offset-x, 0px), var(--offset-y, 0px)) scale(1); }
            50% { transform: translate(var(--offset-x, 0px), var(--offset-y, 0px)) scale(1.05); }
        }
        @keyframes iconPulseBot {
            0%, 100% { transform: translate(var(--offset-x, 0px), var(--offset-y, 0px)) scale(1); }
            50% { transform: translate(var(--offset-x, 0px), var(--offset-y, 0px)) scale(1.05); }
        }
        @keyframes iconPulseApp {
            0%, 100% { transform: translate(var(--offset-x, 0px), var(--offset-y, 0px)) scale(1); }
            50% { transform: translate(var(--offset-x, 0px), var(--offset-y, 0px)) scale(1.05); }
        }

        .item-name { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color 0.3s ease; }
        .item-card:hover .item-name { color: var(--text-bright); }
        .item-desc { font-size: 13px; color: var(--text-dim); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color 0.3s ease; }
        .item-card:hover .item-desc { color: rgba(255, 255, 255, 0.6); }
        
        .action-btns { display: flex; gap: 8px; flex-shrink: 0; position: relative; z-index: 1; }
        .icon-btn {
            width: 40px; height: 40px; border-radius: 14px; background: var(--card-bg); border: 1px solid var(--border);
            color: var(--text-dim); display: flex; align-items: center; justify-content: center; cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); font-size: 14px; position: relative; overflow: hidden;
            backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
        }
        .icon-btn:hover { 
            color: #fff; 
            background: var(--card-hover); 
            border-color: var(--border-bright); 
            transform: scale(1.12) rotate(-5deg); 
            box-shadow: var(--shadow-md); 
        }
        .icon-btn.open-btn { 
            background: linear-gradient(135deg, var(--plugin), #0099cc); 
            color: #000; 
            border-color: transparent; 
            box-shadow: 0 4px 15px rgba(0, 242, 255, 0.35); 
            font-weight: 600;
        }
        .icon-btn.open-btn:hover { 
            box-shadow: 0 6px 25px rgba(0, 242, 255, 0.5), var(--glow-strong) rgba(0, 242, 255, 0.3); 
            transform: scale(1.12) translateY(-2px) rotate(-5deg); 
        }
        .icon-btn:active { transform: scale(0.95) rotate(0deg); }

        .pagination-controls {
            display: flex; align-items: center; justify-content: center; gap: 16px; margin-top: 28px; padding: 8px;
            background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; backdrop-filter: blur(10px);
            opacity: 0; pointer-events: none; transform: translateY(10px); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .pagination-controls.visible { opacity: 1; pointer-events: all; transform: translateY(0); }
        .page-btn {
            width: 44px; height: 44px; border-radius: 12px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border);
            color: var(--text); display: flex; align-items: center; justify-content: center; cursor: pointer;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); position: relative; overflow: hidden;
        }
        .page-btn:hover:not(:disabled) { 
            background: var(--card-hover); 
            border-color: var(--border-bright); 
            transform: scale(1.1) rotate(-5deg); 
        }
        .page-btn:active:not(:disabled) { transform: scale(0.95) rotate(0deg); }
        .page-btn:disabled { opacity: 0.2; cursor: not-allowed; transform: none; }
        .page-info { font-size: 14px; font-weight: 600; color: var(--text-dim); min-width: 70px; text-align: center; }
        .page-info span { color: var(--text); }

        .scroll-top {
            position: fixed; bottom: 24px; right: 24px; width: 56px; height: 56px; border-radius: 50%;
            background: linear-gradient(135deg, var(--plugin), #0099cc); color: #000; border: none;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            box-shadow: 0 8px 30px rgba(0, 242, 255, 0.5), var(--glow-strong) rgba(0, 242, 255, 0.3); font-size: 20px;
            opacity: 0; pointer-events: none; transform: translateY(20px) scale(0.8);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); z-index: 99;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        }
        .scroll-top.visible { opacity: 1; pointer-events: all; transform: translateY(0) scale(1); }
        .scroll-top:hover { 
            transform: translateY(-4px) scale(1.12) rotate(-15deg); 
            box-shadow: 0 12px 40px rgba(0, 242, 255, 0.7), var(--glow-strong) rgba(0, 242, 255, 0.4); 
        }
        .scroll-top:active { transform: scale(0.95) rotate(0deg); }

        .view { display: none; }
        .view.active { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }

        .back-btn {
            display: inline-flex; align-items: center; gap: 8px; color: var(--plugin); font-size: 14px; font-weight: 600;
            margin-bottom: 28px; cursor: pointer; padding: 10px 18px; border-radius: 14px; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            background: rgba(0, 242, 255, 0.05); border: 1px solid rgba(0, 242, 255, 0.15);
        }
        .back-btn:hover { 
            background: rgba(0, 242, 255, 0.1); 
            transform: translateX(-4px) scale(1.05); 
            box-shadow: 0 4px 15px rgba(0, 242, 255, 0.2);
        }
        .back-btn:active { transform: scale(0.96); }

        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-dim); }
        .empty-state i { font-size: 48px; margin-bottom: 16px; opacity: 0.2; }

        .secret-card { border-color: rgba(189, 0, 255, 0.3) !important; background: rgba(189, 0, 255, 0.05) !important; }
        .secret-card .item-name { color: var(--secret) !important; }
        .secret-card .icon-btn.open-btn { background: linear-gradient(135deg, var(--secret), #8800cc); color: #fff; box-shadow: 0 4px 20px rgba(189, 0, 255, 0.3); }

        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: rgba(10, 10, 15, 0.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); color: #fff;
            padding: 16px 32px; border-radius: 100px; font-size: 14px; font-weight: 600;
            opacity: 0; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); z-index: 100;
            border: 1px solid var(--border-glow); display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow-lg), 0 0 30px rgba(0, 242, 255, 0.2);
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .toast i { color: var(--plugin); filter: drop-shadow(0 0 8px rgba(0, 242, 255, 0.5)); }
        
        .swipe-hint {
            text-align: center; color: var(--text-dim); font-size: 12px; margin-top: 12px;
            opacity: 0; transition: opacity 0.5s ease; pointer-events: none;
        }
        .swipe-hint.visible { opacity: 0.5; }
        
        .tab.loading { pointer-events: none; opacity: 0.6; }
    </style>
</head>
<body>
    <div class="ambient-bg"><div class="aurora"></div></div>
    <div class="noise"></div>
    
    <div class="app">
        <div id="view-main" class="view active">
            <div class="header animate-in" style="animation-delay: 0.05s;">
                <h1 id="titleClick" role="button" tabindex="0" aria-label="Каталог">Каталог</h1>
                <div class="secret-counter" id="secretCounter" aria-hidden="true"></div>
            </div>

            <div class="tabs-container animate-in" style="animation-delay: 0.1s;" id="tabsPage1">
                <div class="tabs" role="tablist">
                    <button class="tab active" onclick="switchTab('plugins', this)" role="tab" aria-selected="true">
                        Плагины <span class="tab-count" id="count-plugins">0</span>
                    </button>
                    <button class="tab" onclick="switchTab('apps', this)" role="tab" aria-selected="false">
                        Приложения <span class="tab-count" id="count-apps">0</span>
                    </button>
                </div>
                <button class="nav-tab" onclick="goToTabsPage(2)" aria-label="Следующая страница вкладок">
                    <i class="fas fa-chevron-right" aria-hidden="true"></i>
                </button>
            </div>

            <div class="tabs-container animate-in" style="animation-delay: 0.1s; display: none;" id="tabsPage2">
                <button class="nav-tab" onclick="goToTabsPage(1)" aria-label="Предыдущая страница вкладок">
                    <i class="fas fa-chevron-left" aria-hidden="true"></i>
                </button>

                { name: "Wallify", url: "https://t.me/WallifyApp/4/2370", desc: "Красивые живые обои на телефон" },
                { name: "Larpkeeper", url: "https://t.me/vcvk1/1406", desc: "Фейковый Tonkeeper" }
            ],
            bots: [
                { name: "ChimeraNFT support", url: "https://t.me/eblannftsupbot", desc: "Поддержка разработки" }
            ]
        };

        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            tg.ready();
            tg.setHeaderColor('#050507');
            tg.setBackgroundColor('#050507');
        }
        
        const haptic = (type = 'light') => {
            try { if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred(type); } catch (e) {}
        };

        let state = { 
            activeTab: 'plugins', searchQuery: '', currentPage: 1, 
            itemsPerPage: 5, tabsPage: 1, isAnimating: false, secretViewActive: false
        };

        function throttle(func, limit) {
            let inThrottle;
            return function(...args) {
                if (!inThrottle) {
                    func.apply(this, args);
                    inThrottle = true;
                    setTimeout(() => inThrottle = false, limit);
                }
            };
        }

        function debounce(func, wait) {
            let timeout;
            return function(...args) {
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(this, args), wait);
            };
        }

        function initCounts() {
            document.getElementById('count-plugins').textContent = DATA.plugins.length;
            document.getElementById('count-modules').textContent = DATA.modules.length;
            document.getElementById('count-apps').textContent = DATA.apps.length;
            document.getElementById('count-bots').textContent = DATA.bots.length;
        }

        function createRipple(event, element) {
            if (element.disabled) return;
            const ripple = document.createElement('span');
            const rect = element.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height);
            let clientX, clientY;
            if (event.touches && event.touches.length > 0) {
                clientX = event.touches[0].clientX; clientY = event.touches[0].clientY;
            } else if (event.changedTouches && event.changedTouches.length > 0) {
                clientX = event.changedTouches[0].clientX; clientY = event.changedTouches[0].clientY;
            } else {
                clientX = event.clientX; clientY = event.clientY;
            }
            ripple.style.width = ripple.style.height = `${size}px`;
            ripple.style.left = `${clientX - rect.left - size / 2}px`;
            ripple.style.top = `${clientY - rect.top - size / 2}px`;
            ripple.classList.add('ripple');
            element.appendChild(ripple);
            setTimeout(() => { if (ripple.parentNode) ripple.remove(); }, 600);
        }

        document.querySelectorAll('.tab, .nav-tab, .page-btn, .scroll-top').forEach(el => {
            el.addEventListener('mousedown', function(e) { if (e.button === 0) createRipple(e, this); });
            el.addEventListener('touchstart', function(e) { createRipple(e, this); }, { passive: true });
        });

        function goToTabsPage(page) {
            if (state.isAnimating) return;
            haptic('medium');
            state.tabsPage = page;
            document.getElementById('tabsPage1').style.display = page === 1 ? 'flex' : 'none';
            document.getElementById('tabsPage2').style.display = page === 2 ? 'flex' : 'none';
            state.activeTab = page === 1 ? 'plugins' : 'modules';
            state.searchQuery = '';
            state.currentPage = 1;
            document.getElementById('searchInput').value = '';
            document.getElementById('clearSearch').classList.remove('visible');
            document.querySelectorAll('.tab').forEach(t => {
                t.classList.remove('active');
                t.setAttribute('aria-selected', 'false');
            });
            const tabs = document.querySelectorAll(`#tabsPage${page} .tab`);
            if (tabs.length > 0) {
                tabs[0].classList.add('active');
                tabs[0].setAttribute('aria-selected', 'true');
            }
            renderList();
        }

        let secretClicks = 0, lastClickTime = 0;
        const SECRET_CLICKS_REQUIRED = 7, SECRET_CLICK_TIMEOUT = 2000;

        function handleSecretClick() {
            const now = Date.now();
            if (now - lastClickTime > SECRET_CLICK_TIMEOUT) secretClicks = 0;
            secretClicks++;
            lastClickTime = now;
            const counter = document.getElementById('secretCounter');
            counter.classList.add('visible', 'pulse');
            setTimeout(() => counter.classList.remove('pulse'), 300);
            if (secretClicks >= SECRET_CLICKS_REQUIRED) {
                haptic('heavy');
                openSecret();
                secretClicks = 0;
                counter.classList.remove('visible');
                return;
            }
            setTimeout(() => {
                if (Date.now() - lastClickTime >= SECRET_CLICK_TIMEOUT) {
                    secretClicks = 0;
                    counter.classList.remove('visible');
                }
            }, SECRET_CLICK_TIMEOUT);
        }

        const titleClick = document.getElementById('titleClick');
        titleClick.addEventListener('click', handleSecretClick);
        titleClick.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); handleSecretClick(); }
        });

        function getFilteredItems() {
            if (state.searchQuery) {
                const query = state.searchQuery.toLowerCase();
                return Object.values(DATA).flat().filter(item => 
                    item && item.name && (
                        item.name.toLowerCase().includes(query) || 
                        (item.desc && item.desc.toLowerCase().includes(query))
                    )
                );
            }
            return DATA[state.activeTab] || [];
        }

        const searchInput = document.getElementById('searchInput');
        const clearSearchBtn = document.getElementById('clearSearch');

        const debouncedSearch = debounce((query) => {
            state.searchQuery = query.toLowerCase().trim();
            state.currentPage = 1;
            renderList();
        }, 150);

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value;
            clearSearchBtn.classList.toggle('visible', query.length > 0);
            clearSearchBtn.tabIndex = query.length > 0 ? 0 : -1;
            debouncedSearch(query);
        });

        function clearSearchInput() {
            haptic('light');
            searchInput.value = '';
            clearSearchBtn.classList.remove('visible');
            clearSearchBtn.tabIndex = -1;
            state.searchQuery = '';
            state.currentPage = 1;
            renderList();
            searchInput.focus();
        }

        function switchTab(tab, element) {
            if (state.isAnimating || state.activeTab === tab) return;
            haptic('medium');
            element.classList.add('loading');
            document.querySelectorAll('.tab').forEach(t => {
                t.classList.remove('active');
                t.setAttribute('aria-selected', 'false');
            });
            element.classList.add('active');
            element.setAttribute('aria-selected', 'true');
            state.activeTab = tab;
            if (!state.searchQuery) state.currentPage = 1;
            setTimeout(() => {
                element.classList.remove('loading');
                renderList();
            }, 100);
        }

        let pageChangeTimeout = null;

        function changePage(direction) {
            if (state.isAnimating) return;
            const filtered = getFilteredItems();
            const totalPages = Math.ceil(filtered.length / state.itemsPerPage) || 1;
            const newPage = state.currentPage + direction;
            if (newPage < 1 || newPage > totalPages) return;
            
            state.isAnimating = true;
            haptic('light');
            const list = document.getElementById('content-list');
            if (pageChangeTimeout) clearTimeout(pageChangeTimeout);
            
            list.classList.add('fade-out');
            list.classList.remove('fade-in');
            
            pageChangeTimeout = setTimeout(() => {
                state.currentPage = newPage;
                list.classList.remove('fade-out'); // ✅ убираем fade-out ДО рендера, чтобы skeleton был виден
                renderList();
                const listRect = list.getBoundingClientRect();
                const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
                window.scrollTo({ top: Math.max(0, listRect.top + scrollTop - 100), behavior: 'smooth' });
                state.isAnimating = false;
            }, 300);
        }

        // ========================================
        // ✅ ПОЛНОСТЬЮ ПЕРЕПИСАННЫЙ СВАЙП
        // ========================================
        const SWIPE_THRESHOLD = 70;
        const SWIPE_MAX_VERTICAL = 70;
        const SWIPE_MAX_TIME = 800;

        let touchStartX = 0, touchStartY = 0, touchStartTime = 0;
        let swipeDirectionLocked = null;

        const contentList = document.getElementById('content-list');

        contentList.addEventListener('touchstart', (e) => {
            if (e.touches.length !== 1) return;
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            touchStartTime = Date.now();
            swipeDirectionLocked = null;
        }, { passive: true });

        contentList.addEventListener('touchmove', (e) => {
            if (swipeDirectionLocked) return;
            const dx = e.touches[0].clientX - touchStartX;
            const dy = e.touches[0].clientY - touchStartY;
            // ✅ Блокировка направления: вертикально = скролл, горизонтально = свайп
            if (Math.abs(dx) > 12 || Math.abs(dy) > 12) {
                swipeDirectionLocked = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
            }
        }, { passive: true });

        contentList.addEventListener('touchend', (e) => {
            const dx = e.changedTouches[0].clientX - touchStartX;
            const dy = Math.abs(e.changedTouches[0].clientY - touchStartY);
            const dt = Date.now() - touchStartTime;
            
            // ✅ Свайп срабатывает ЛЮБОМ месте списка (включая карточки),
            // но только если это действительно горизонтальное движение
            if (swipeDirectionLocked === 'h' && Math.abs(dx) > SWIPE_THRESHOLD && dy < SWIPE_MAX_VERTICAL && dt < SWIPE_MAX_TIME) {
                e.preventDefault(); // ✅ глушим клик, чтобы не открылась ссылка
                markSwipeHintUsed();
                changePage(dx < 0 ? 1 : -1);
            }
        }, { passive: false });

        function showSwipeHint() {
            const isTouch = matchMedia('(hover: none)').matches || 'ontouchstart' in window;
            const hint = document.getElementById('swipeHint');
            let shown = false;
            try { shown = !!localStorage.getItem('swipeHintShown'); } catch (e) {}
            if (!isTouch || !hint || shown) return;
            setTimeout(() => {
                hint.classList.add('visible');
                setTimeout(() => hint.classList.remove('visible'), 3500);
            }, 1500);
        }

        function markSwipeHintUsed() {
            try { localStorage.setItem('swipeHintShown', '1'); } catch (e) {}
            const hint = document.getElementById('swipeHint');
            if (hint) hint.classList.remove('visible');
        }

        const scrollTopBtn = document.getElementById('scrollTopBtn');
        const throttledScroll = throttle(() => {
            const showButton = window.scrollY > 600;
            scrollTopBtn.classList.toggle('visible', showButton);
            scrollTopBtn.tabIndex = showButton ? 0 : -1;
        }, 100);
        window.addEventListener('scroll', throttledScroll, { passive: true });

        function scrollToTop() {
            haptic('light');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function showSkeleton() {
            const list = document.getElementById('content-list');
            const filtered = getFilteredItems();
            if (filtered.length === 0) return; // ✅ не показываем skeleton для пустых результатов
            list.innerHTML = '';
            for (let i = 0; i < Math.min(3, state.itemsPerPage); i++) {
                const skel = document.createElement('div');
                skel.className = 'skeleton-card';
                skel.setAttribute('aria-hidden', 'true');
                skel.innerHTML = `<div class="skeleton-icon"></div><div class="skeleton-text"><div class="skeleton-line"></div><div class="skeleton-line"></div></div>`;
                list.appendChild(skel);
            }
        }

        function renderList() {
            const list = document.getElementById('content-list');
            const pagination = document.getElementById('paginationControls');
            const filtered = getFilteredItems();
            const totalPages = Math.ceil(filtered.length / state.itemsPerPage) || 1;
            if (state.currentPage > totalPages) state.currentPage = 1;

            if (totalPages > 1 && filtered.length > 0) {
                pagination.classList.add('visible');
                document.getElementById('currentPageNum').textContent = state.currentPage;
                document.getElementById('totalPagesNum').textContent = totalPages;
                document.getElementById('prevPageBtn').disabled = state.currentPage === 1;
                document.getElementById('nextPageBtn').disabled = state.currentPage === totalPages;
            } else {
                pagination.classList.remove('visible');
            }

            if (filtered.length > 0) showSkeleton();
            const delay = filtered.length > 0 ? 150 : 0;
            
            setTimeout(() => {
                list.innerHTML = '';
                if (filtered.length === 0) {
                    let emptyMsg = state.activeTab === 'bots' 
                        ? '🚧 Раздел в разработке...<br>Скоро здесь появятся лучшие боты' 
                        : state.searchQuery 
                            ? `Ничего не найдено по запросу «${state.searchQuery}»`
                            : 'Ничего не найдено';
                    list.innerHTML = `<div class="empty-state animate-in" role="status"><i class="fas fa-ghost" aria-hidden="true"></i><br>${emptyMsg}</div>`;
                    list.classList.remove('fade-out');
                    list.classList.add('fade-in');
                    return;
                }

                const start = (state.currentPage - 1) * state.itemsPerPage;
                const end = start + state.itemsPerPage;
                const pageItems = filtered.slice(start, end);

                pageItems.forEach((item, index) => {
                    const div = document.createElement('div');
                    div.className = 'item-card animate-in';
                    div.style.animationDelay = `${index * 0.06}s`;
                    div.setAttribute('role', 'listitem');
                    
                    const throttledMouseMove = throttle((e) => {
                        const rect = div.getBoundingClientRect();
                        const mouseX = e.clientX - rect.left;
                        const mouseY = e.clientY - rect.top;
                        const centerX = rect.width / 2;
                        const centerY = rect.height / 2;
                        const maxOffset = 6;
                        div.style.setProperty('--mouse-x', `${mouseX}px`);
                        div.style.setProperty('--mouse-y', `${mouseY}px`);
                        const svg = div.querySelector('.icon-svg');
                        if (svg) {
                            svg.style.setProperty('--offset-x', `${-((mouseX - centerX) / centerX) * maxOffset}px`);
                            svg.style.setProperty('--offset-y', `${-((mouseY - centerY) / centerY) * maxOffset}px`);
                        }
                    }, 16);
                    
                    div.addEventListener('mousemove', throttledMouseMove);
                    div.addEventListener('mouseleave', () => {
                        const svg = div.querySelector('.icon-svg');
                        if (svg) {
                            svg.style.setProperty('--offset-x', '0px');
                            svg.style.setProperty('--offset-y', '0px');
                        }
                    });
                    
                    let displayName = item.name;
                    if (state.searchQuery) {
                        const escapedQuery = state.searchQuery.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                        const regex = new RegExp(`(${escapedQuery})`, 'gi');
                        displayName = item.name.replace(regex, '<mark style="background: rgba(0, 242, 255, 0.2); color: var(--plugin); padding: 0 2px; border-radius: 3px;">$1</mark>');
                    }

                    let iconHTML = '';
                    if (state.activeTab === 'plugins' && ICONS.plugins[item.name]) iconHTML = `<div class="icon-wrapper">${ICONS.plugins[item.name]}</div>`;
                    else if (state.activeTab === 'modules' && ICONS.modules[item.name]) iconHTML = `<div class="icon-wrapper">${ICONS.modules[item.name]}</div>`;
                    else if (state.activeTab === 'bots' && ICONS.bots[item.name]) iconHTML = `<div class="icon-wrapper">${ICONS.bots[item.name]}</div>`;
                    else if (state.activeTab === 'apps' && ICONS.apps[item.name]) iconHTML = `<div class="icon-wrapper">${ICONS.apps[item.name]}</div>`;
                    else iconHTML = `<div class="icon-wrapper"><i class="fas fa-cube" style="font-size: 24px; color: var(--module);" aria-hidden="true"></i></div>`;

                    div.innerHTML = `
                        <div class="item-info" onclick="openLink('${item.url}')" tabindex="0" role="button" aria-label="Открыть ${item.name}">
                            ${iconHTML}
                            <div style="flex:1; min-width:0;">
                                <div class="item-name">${displayName}</div>
                                <div class="item-desc">${item.desc || ''}</div>
                            </div>
                        </div>
                        <div class="action-btns">
                            <button class="icon-btn" onclick="copyLink('${item.url}', event)" title="Копировать" aria-label="Копировать ссылку">
                                <i class="fas fa-copy" aria-hidden="true"></i>
                            </button>
                            <button class="icon-btn open-btn" onclick="openLink('${item.url}')" title="Открыть" aria-label="Открыть ссылку">
                                <i class="fas fa-external-link-alt" aria-hidden="true"></i>
                            </button>
                        </div>
                    `;
                    list.appendChild(div);
                });
                
                list.classList.remove('fade-out');
                list.classList.add('fade-in');
                setTimeout(() => list.classList.remove('fade-in'), 400);
            }, delay);
        }

        function openLink(url) {
            haptic('heavy');
            if (!url || typeof url !== 'string') { showToast('Ошибка: неверная ссылка'); return; }
            try {
                if (tg?.openTelegramLink) tg.openTelegramLink(url);
                else window.open(url, '_blank', 'noopener,noreferrer');
            } catch (e) {
                console.error('Ошибка открытия ссылки:', e);
                showToast('Не удалось открыть ссылку');
            }
        }
        
        function copyLink(url, event) {
            if (event) event.stopPropagation();
            haptic('medium');
            if (!url || typeof url !== 'string') { showToast('Ошибка: неверная ссылка'); return; }
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(url).then(() => showToast('Ссылка скопирована!'))
                    .catch(() => fallbackCopy(url));
            } else fallbackCopy(url);
        }

        function fallbackCopy(text) {
            const textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            textArea.style.left = '-999999px';
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy') ? showToast('Ссылка скопирована!') : showToast('Не удалось скопировать');
            } catch (err) { showToast('Не удалось скопировать'); }
            document.body.removeChild(textArea);
        }

        let toastTimeout = null;
        function showToast(text) {
            if (toastTimeout) clearTimeout(toastTimeout);
            document.getElementById('toastText').textContent = text;
            document.getElementById('toast').classList.add('show');
            toastTimeout = setTimeout(() => document.getElementById('toast').classList.remove('show'), 2000);
        }

        function openSecret() {
            if (state.secretViewActive) return;
            haptic('heavy');
            state.secretViewActive = true;
            document.getElementById('view-main').classList.remove('active');
            document.getElementById('view-secret').classList.add('active');
            if (tg?.BackButton) { tg.BackButton.show(); tg.BackButton.onClick(closeSecret); }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function closeSecret() {
            if (!state.secretViewActive) return;
            haptic('medium');
            state.secretViewActive = false;
            document.getElementById('view-secret').classList.remove('active');
            document.getElementById('view-main').classList.add('active');
            if (tg?.BackButton) tg.BackButton.hide();
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && state.secretViewActive) closeSecret();
        });

        initCounts();
        renderList();
        showSwipeHint();
    </script>
</body>
