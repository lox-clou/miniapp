<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Каталог</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #050507;
            --card-bg: rgba(255, 255, 255, 0.03);
            --text: #ffffff;
            --text-dim: #8b8b9e;
            --plugin: #00f2ff;
            --module: #ff9500;
            --app: #ff2d55;
            --bot: #bd00ff;
            --secret: #bd00ff;
            --border: rgba(255, 255, 255, 0.08);
            --glow: 0 0 20px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Inter', -apple-system, sans-serif; }
        
        body { background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; padding-bottom: 40px; }

        .ambient-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; background: var(--bg); }
        .aurora {
            position: absolute; width: 150%; height: 150%; top: -25%; left: -25%;
            background: conic-gradient(from 0deg at 50% 50%, transparent 0deg, rgba(0, 242, 255, 0.1) 60deg, transparent 120deg, rgba(255, 45, 85, 0.1) 180deg, transparent 240deg, rgba(189, 0, 255, 0.1) 300deg, transparent 360deg);
            animation: rotate 30s linear infinite; filter: blur(100px);
        }
        .aurora::after {
            content: ''; position: absolute; inset: 0;
            background: conic-gradient(from 180deg at 50% 50%, transparent 0deg, rgba(189, 0, 255, 0.08) 90deg, transparent 180deg, rgba(0, 242, 255, 0.08) 270deg, transparent 360deg);
            animation: rotate 40s linear infinite reverse; filter: blur(80px);
        }
        @keyframes rotate { from { transform: translate(0, 0) rotate(0deg); } to { transform: translate(0, 0) rotate(360deg); } }

        .noise {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.03; pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .app { max-width: 480px; margin: 0 auto; padding: 20px 16px 40px; position: relative; }

        .header { 
            display: flex; justify-content: center; align-items: center; margin-bottom: 28px; padding-top: 8px; position: relative;
        }
        .header h1 {
            font-size: 14px; font-weight: 800; letter-spacing: 4px; text-transform: uppercase;
            background: linear-gradient(135deg, #fff 0%, var(--plugin) 50%, var(--app) 100%);
            background-size: 200% 200%; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: gradientShift 6s ease infinite; cursor: pointer; user-select: none; transition: transform 0.1s ease; text-align: center;
        }
        .header h1:active { transform: scale(0.95); }
        @keyframes gradientShift { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
        
        .secret-counter {
            position: absolute; top: 50%; right: 0; transform: translateY(-50%); width: 6px; height: 6px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.1); opacity: 0; transition: opacity 0.3s ease; pointer-events: none;
        }
        .secret-counter.visible { opacity: 1; }
        .secret-counter.pulse { animation: counterPulse 0.3s ease; }
        @keyframes counterPulse {
            0%, 100% { transform: translateY(-50%) scale(1); }
            50% { transform: translateY(-50%) scale(2); background: rgba(189, 0, 255, 0.8); box-shadow: 0 0 10px rgba(189, 0, 255, 0.8); }
        }

        .tabs-container { display: flex; align-items: center; gap: 8px; margin-bottom: 24px; }
        .tabs { display: flex; gap: 8px; flex: 1; overflow: hidden; }
        
        .tab {
            flex: 1; padding: 12px 8px; border-radius: 100px; background: var(--card-bg); border: 1px solid var(--border);
            color: var(--text-dim); font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center; white-space: nowrap; position: relative; overflow: hidden;
        }
        .tab.active { 
            color: #fff; background: rgba(255, 255, 255, 0.06); border-color: rgba(255, 255, 255, 0.15); 
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255,255,255,0.1);
        }
        .tab:active { transform: scale(0.96); }
        
        .tab .ripple, .nav-tab .ripple {
            position: absolute; border-radius: 50%; background: rgba(255, 255, 255, 0.15);
            transform: scale(0); animation: ripple 0.6s linear; pointer-events: none;
        }
        @keyframes ripple { to { transform: scale(4); opacity: 0; } }

        .nav-tab {
            flex-shrink: 0; width: 44px; height: 44px; border-radius: 100px; background: var(--card-bg); border: 1px solid var(--border);
            color: var(--text-dim); display: flex; align-items: center; justify-content: center; cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); font-size: 14px; position: relative; overflow: hidden;
        }
        .nav-tab:hover { color: #fff; background: rgba(255, 255, 255, 0.06); border-color: rgba(255, 255, 255, 0.15); transform: scale(1.05); }
        .nav-tab:active { transform: scale(0.95); }

        .search-box { position: relative; margin-bottom: 28px; }
        .search-input {
            width: 100%; background: var(--card-bg); border: 1px solid var(--border); border-radius: 18px;
            padding: 16px 45px 16px 50px; color: var(--text); font-size: 15px; outline: none; transition: all 0.3s;
        }
        .search-input::placeholder { color: var(--text-dim); }
        .search-input:focus { border-color: var(--plugin); box-shadow: 0 0 0 3px rgba(0, 242, 255, 0.1), var(--glow) rgba(0, 242, 255, 0.1); background: rgba(255, 255, 255, 0.04); }
        .search-icon { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--text-dim); transition: color 0.3s; pointer-events: none; }
        .search-input:focus ~ .search-icon { color: var(--plugin); }
        .clear-search {
            position: absolute; right: 16px; top: 50%; transform: translateY(-50%); color: var(--text-dim);
            cursor: pointer; opacity: 0; transition: all 0.2s; pointer-events: none;
        }
        .clear-search.visible { opacity: 1; pointer-events: all; }
        .clear-search:hover { color: var(--text); }

        .items-list { display: flex; flex-direction: column; gap: 12px; min-height: 200px; }
        
        .item-card {
            background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; padding: 16px;
            display: flex; align-items: center; justify-content: space-between; cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); position: relative; overflow: hidden;
        }
        .item-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(600px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(255, 255, 255, 0.06), transparent 40%);
            opacity: 0; transition: opacity 0.4s; pointer-events: none;
        }
        .item-card::after {
            content: ''; position: absolute; inset: 0; border-radius: 20px; padding: 1px;
            background: linear-gradient(135deg, rgba(0, 242, 255, 0.2), rgba(189, 0, 255, 0.2));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor; mask-composite: exclude; opacity: 0; transition: opacity 0.4s; pointer-events: none;
        }
        .item-card:hover { 
            transform: translateY(-3px); border-color: rgba(255, 255, 255, 0.15); 
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 242, 255, 0.05);
        }
        .item-card:hover::before { opacity: 1; }
        .item-card:hover::after { opacity: 1; }
        .item-card:active { transform: translateY(-1px) scale(0.99); }
        
        .item-info { 
            display: flex; align-items: center; gap: 16px; flex: 1; min-width: 0; position: relative; z-index: 1;
        }
        
        /* ✅ ИКОНКИ: Обертка отвечает за масштаб, SVG внутри за отталкивание */
        .icon-wrapper {
            width: 52px; height: 52px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .icon-svg {
            width: 100%; height: 100%; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        /* ✅ ИСПРАВЛЕНИЕ: Убраны конфликты CSS hover с JS анимацией */
        .item-card:hover .icon-wrapper { transform: scale(1.1); }
        
        /* Filter применяется только к SVG, не конфликтует с transform */
        .item-card:hover .plugin-svg { filter: drop-shadow(0 0 8px rgba(0, 242, 255, 0.5)); }
        .item-card:hover .module-svg { filter: drop-shadow(0 0 8px rgba(255, 149, 0, 0.5)); }
        .item-card:hover .bot-svg { filter: drop-shadow(0 0 8px rgba(189, 0, 255, 0.5)); }
        .item-card:hover .app-svg { filter: drop-shadow(0 4px 15px rgba(255, 45, 85, 0.4)); }

        .item-name { 
            font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color 0.3s ease;
        }
        .item-card:hover .item-name { color: #fff; }
        .item-desc { 
            font-size: 13px; color: var(--text-dim); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color 0.3s ease;
        }
        .item-card:hover .item-desc { color: rgba(255, 255, 255, 0.5); }
        
        .action-btns { display: flex; gap: 8px; flex-shrink: 0; position: relative; z-index: 1; }
        .icon-btn {
            width: 38px; height: 38px; border-radius: 12px; background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border);
            color: var(--text-dim); display: flex; align-items: center; justify-content: center; cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); font-size: 14px; position: relative; overflow: hidden;
        }
        .icon-btn:hover { color: #fff; background: rgba(255, 255, 255, 0.08); border-color: rgba(255, 255, 255, 0.2); transform: scale(1.1); }
        .icon-btn.open-btn { 
            background: linear-gradient(135deg, var(--plugin), #0099cc); color: #000; border-color: transparent; 
            box-shadow: 0 4px 15px rgba(0, 242, 255, 0.2); 
        }
        .icon-btn.open-btn:hover { box-shadow: 0 6px 25px rgba(0, 242, 255, 0.4); transform: scale(1.1); }
        .icon-btn:active { transform: scale(0.95); }

        .pagination { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 28px; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .pagination.visible { opacity: 1; pointer-events: all; }
        .page-dots { display: flex; gap: 8px; }
        .page-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255, 255, 255, 0.15); cursor: pointer; transition: all 0.3s ease; }
        .page-dot:hover { background: rgba(255, 255, 255, 0.4); transform: scale(1.3); }
        .page-dot.active { width: 24px; border-radius: 4px; background: var(--plugin); box-shadow: 0 0 10px var(--plugin); }

        .view { display: none; }
        .view.active { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }

        .back-btn {
            display: inline-flex; align-items: center; gap: 8px; color: var(--plugin); font-size: 14px; font-weight: 600;
            margin-bottom: 28px; cursor: pointer; padding: 10px 18px; border-radius: 14px; transition: all 0.3s;
            background: rgba(0, 242, 255, 0.05); border: 1px solid rgba(0, 242, 255, 0.15);
        }
        .back-btn:hover { background: rgba(0, 242, 255, 0.1); transform: translateX(-4px); }
        .back-btn:active { transform: scale(0.96); }

        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-dim); }
        .empty-state i { font-size: 48px; margin-bottom: 16px; opacity: 0.2; }

        .secret-card { border-color: rgba(189, 0, 255, 0.3) !important; background: rgba(189, 0, 255, 0.05) !important; }
        .secret-card .item-name { color: var(--secret) !important; }
        .secret-card .icon-btn.open-btn { background: linear-gradient(135deg, var(--secret), #8800cc); color: #fff; box-shadow: 0 4px 20px rgba(189, 0, 255, 0.3); }

        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: rgba(10, 10, 15, 0.9); backdrop-filter: blur(20px); color: #fff;
            padding: 14px 28px; border-radius: 100px; font-size: 14px; font-weight: 600;
            opacity: 0; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); z-index: 100;
            border: 1px solid var(--border); display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .toast i { color: var(--plugin); }
    </style>
</head>
<body>
    <div class="ambient-bg"><div class="aurora"></div></div>
    <div class="noise"></div>
    
    <div class="app">
        <div id="view-main" class="view active">
            <div class="header animate-in" style="animation-delay: 0.05s;">
                <h1 id="titleClick">Каталог</h1>
                <div class="secret-counter" id="secretCounter"></div>
            </div>

            <div class="tabs-container animate-in" style="animation-delay: 0.1s;" id="tabsPage1">
                <div class="tabs">
                    <div class="tab active" onclick="switchTab('plugins', this)">Плагины</div>
                    <div class="tab" onclick="switchTab('apps', this)">Приложения</div>
                </div>
                <div class="nav-tab" onclick="goToTabsPage(2)" title="Следующая страница"><i class="fas fa-chevron-right"></i></div>
            </div>

            <div class="tabs-container animate-in" style="animation-delay: 0.1s; display: none;" id="tabsPage2">
                <div class="nav-tab" onclick="goToTabsPage(1)" title="Предыдущая страница"><i class="fas fa-chevron-left"></i></div>
                <div class="tabs">
                    <div class="tab" onclick="switchTab('modules', this)">Модули</div>
                    <div class="tab" onclick="switchTab('bots', this)">Боты</div>
                </div>
            </div>

            <div class="search-box animate-in" style="animation-delay: 0.15s;">
                <input type="text" class="search-input" id="searchInput" placeholder="Поиск по каталогу..." oninput="handleSearch(this.value)">
                <i class="fas fa-search search-icon"></i>
                <i class="fas fa-times clear-search" id="clearSearch" onclick="clearSearchInput()"></i>
            </div>

            <div id="content-list" class="items-list"></div>
            <div class="pagination" id="pagination"><div class="page-dots" id="pageDots"></div></div>
        </div>

        <div id="view-secret" class="view">
            <div class="back-btn animate-in" onclick="closeSecret()"><i class="fas fa-arrow-left"></i> Назад</div>
            <div class="header animate-in" style="animation-delay: 0.1s;">
                <h1 style="background: linear-gradient(135deg, var(--secret), var(--app)); -webkit-background-clip: text;">Secret</h1>
            </div>
            <div class="items-list">
                <div class="item-card secret-card animate-in" style="animation-delay: 0.2s;" onclick="openLink('https://t.me/exterapl/838')">
                    <div class="item-info">
                        <div class="icon-wrapper"><i class="fas fa-skull" style="font-size: 24px; color: var(--secret);"></i></div>
                        <div style="flex:1; min-width:0;">
                            <div class="item-name">Секретный Плагин</div>
                            <div class="item-desc">Доступ только для избранных</div>
                        </div>
                    </div>
                    <div class="action-btns">
                        <div class="icon-btn open-btn"><i class="fas fa-external-link-alt"></i></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"><i class="fas fa-check-circle"></i> Ссылка скопирована!</div>

    <script>

                'miniPlayer+': `<svg class="icon-svg plugin-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="g8" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#4A9FE5"/><stop offset="100%" stop-color="#00f2ff"/></linearGradient></defs><rect x="20" y="35" width="60" height="30" rx="15" fill="none" stroke="url(#g8)" stroke-width="4"/><circle cx="40" cy="50" r="6" fill="url(#g8)"/><path d="M60 45 L60 55 L70 50 Z" fill="url(#g8)"/></svg>`,
                'Hide link preview fork': `<svg class="icon-svg plugin-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="g9" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#4A9FE5"/><stop offset="100%" stop-color="#00f2ff"/></linearGradient></defs><path d="M30 50 Q50 20 70 50 Q50 80 30 50" fill="none" stroke="url(#g9)" stroke-width="4"/><circle cx="50" cy="50" r="10" fill="none" stroke="url(#g9)" stroke-width="4"/><line x1="35" y1="65" x2="65" y2="35" stroke="url(#g9)" stroke-width="4" stroke-linecap="round"/></svg>`,

                'Log overlay': `<svg class="icon-svg plugin-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="g11" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#4A9FE5"/><stop offset="100%" stop-color="#00f2ff"/></linearGradient></defs><rect x="20" y="25" width="60" height="50" rx="6" fill="none" stroke="url(#g11)" stroke-width="4"/><path d="M30 40 L45 40 M30 50 L55 50 M30 60 L40 60" stroke="url(#g11)" stroke-width="4" stroke-linecap="round"/><circle cx="70" cy="65" r="6" fill="url(#g11)"/></svg>`,
                'Transcriber fork': `<svg class="icon-svg plugin-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="g12" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#4A9FE5"/><stop offset="100%" stop-color="#00f2ff"/></linearGradient></defs><path d="M40 30 L40 55 Q40 65 50 65 Q60 65 60 55 L60 30" fill="none" stroke="url(#g12)" stroke-width="4"/><circle cx="50" cy="30" r="10" fill="none" stroke="url(#g12)" stroke-width="4"/><path d="M70 40 L70 60 M78 45 L78 55 M86 35 L86 65" stroke="url(#g12)" stroke-width="4" stroke-linecap="round" opacity="0.6"/></svg>`,
                'Bot login': `<svg class="icon-svg plugin-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="g13" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#4A9FE5"/><stop offset="100%" stop-color="#00f2ff"/></linearGradient></defs><rect x="30" y="35" width="40" height="30" rx="8" fill="none" stroke="url(#g13)" stroke-width="4"/><circle cx="42" cy="50" r="4" fill="url(#g13)"/><circle cx="58" cy="50" r="4" fill="url(#g13)"/><path d="M50 25 L50 35" stroke="url(#g13)" stroke-width="4"/><path d="M40 75 Q50 85 60 75" fill="none" stroke="url(#g13)" stroke-width="4" stroke-linecap="round"/></svg>`
            },
            modules: {
                'Source trigger': `<svg class="icon-svg module-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="m1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FF9500"/><stop offset="100%" stop-color="#FFD700"/></linearGradient></defs><path d="M55 15 L25 55 L45 55 L40 85 L75 40 L55 40 Z" fill="url(#m1)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/></svg>`,
                'Giveaway joiner': `<svg class="icon-svg module-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="m2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FF6B6B"/><stop offset="100%" stop-color="#FFD93D"/></linearGradient></defs><path d="M50 15 L58 35 L80 35 L62 48 L70 70 L50 56 L30 70 L38 48 L20 35 L42 35 Z" fill="url(#m2)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/></svg>`,
                'Module list': `<svg class="icon-svg module-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="m3" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FF9500"/><stop offset="100%" stop-color="#FF5E3A"/></linearGradient></defs><rect x="20" y="20" width="60" height="8" rx="4" fill="url(#m3)"/><rect x="20" y="40" width="60" height="8" rx="4" fill="url(#m3)"/><rect x="20" y="60" width="60" height="8" rx="4" fill="url(#m3)"/><rect x="20" y="80" width="40" height="8" rx="4" fill="url(#m3)"/></svg>`
            },
            apps: {
                // ✅ ВЕРНУТЫ СТАРЫЕ ИКОНКИ ПРИЛОЖЕНИЙ (НЕЛЬЗЯ МЕНЯТЬ)
                'TikTok You v3.4': `<svg class="icon-svg app-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M65 20 C65 30, 70 35, 80 35 L80 45 C70 45, 65 42, 60 38 L60 65 C60 75, 52 82, 42 82 C32 82, 25 75, 25 65 C25 55, 32 48, 42 48 C44 48, 46 48.5, 48 49 L48 59 C46 58.5, 44 58, 42 58 C37 58, 35 61, 35 65 C35 69, 38 72, 42 72 C47 72, 50 69, 50 65 L50 20 L65 20 Z" fill="#6B5B95"/></svg>`,
                'Wallify': `<svg class="icon-svg app-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M50 10 C60 10, 70 15, 75 25 C80 35, 85 40, 85 50 C85 60, 80 70, 70 75 C60 80, 55 85, 50 85 C45 85, 40 80, 30 75 C20 70, 15 60, 15 50 C15 40, 20 35, 25 25 C30 15, 40 10, 50 10 Z" fill="#8B4513"/><text x="50" y="62" font-family="Arial" font-size="40" font-weight="bold" fill="#1a1a1a" text-anchor="middle">W</text></svg>`,
                'Larpkeeper': `<svg class="icon-svg app-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><polygon points="50,15 80,40 50,85 20,40" fill="#4A90E2"/><polygon points="50,15 80,40 50,40" fill="#5BA3F5"/><polygon points="50,40 80,40 50,85" fill="#3A7BC8"/><polygon points="50,40 20,40 50,85" fill="#2E6BB5"/></svg>`
            },
            bots: {
                // ✅ ИЗМЕНЕНО НАЗВАНИЕ НА "ChimeraNFT support"
                'ChimeraNFT support': `<svg class="icon-svg bot-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="b1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#bd00ff"/><stop offset="100%" stop-color="#ff2d55"/></linearGradient></defs><path d="M50 20 C35 20 25 30 25 45 L25 55 C25 60 29 64 34 64 L40 64 L40 75 L60 75 L60 64 L66 64 C71 64 75 60 75 55 L75 45 C75 30 65 20 50 20 Z" fill="url(#b1)"/><circle cx="40" cy="45" r="4" fill="#fff"/><circle cx="60" cy="45" r="4" fill="#fff"/><path d="M30 35 Q20 35 20 45 L20 55 Q20 65 30 65" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="M70 35 Q80 35 80 45 L80 55 Q80 65 70 65" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="M45 55 Q50 60 55 55" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>`
            }
        };

        const DATA = {
            plugins: [
                { name: "ChimeraNFT", url: "https://t.me/vcvk1/1662", desc: "NFT юзернеймы, номера и подарки" },
                { name: "LocalEditor", url: "https://t.me/exteraPluginsSup/221", desc: "Редактирование сообщений без пересылки" },
                { name: "Lyrics+", url: "https://t.me/thefantiq/22", desc: "Тексты песен прямо в плеере" },
                { name: "Animated Wallpaper", url: "https://t.me/swagnonher/321", desc: "Живые обои для фона чатов" },
                { name: "reSwaga", url: "https://t.me/meeowPlugins/213", desc: "Карточки и треки со всех площадок" },
                { name: "re:extera", url: "https://t.me/shikaatuxplugins/224", desc: "Расширенные настройки Extera" },
                { name: "Quotify+", url: "https://t.me/mur_live/1537", desc: "Создание красивых цитат" },
                { name: "miniPlayer+", url: "https://t.me/RnPlugins/1083", desc: "Продвинутый мини-плеер" },
                { name: "Hide link preview fork", url: "https://t.me/kchemi_projects/125", desc: "Скрытие предпросмотра ссылок" },
                { name: "UITweaks x QuantaHut", url: "https://t.me/QuantaPlugins/210", desc: "Глубокая кастомизация интерфейса" },
                { name: "Log overlay", url: "https://t.me/RnPlugins/620", desc: "Отображение логов поверх экрана" },
                { name: "Transcriber fork", url: "https://t.me/kchemi_projects/12", desc: "Расшифровка голосовых в текст" },
                { name: "Bot login", url: "https://t.me/kvucoPlugins/54", desc: "Удобный вход через ботов" }
            ],
            modules: [
                { name: "Source trigger", url: "https://t.me/RnPlugins/1097", desc: "Триггеры на сообщения" },
                { name: "Giveaway joiner", url: "https://t.me/kchemi_projects/142", desc: "Авто-участие в розыгрышах" },
                { name: "Module list", url: "https://t.me/kchemi_projects/207", desc: "Управление списком модулей" }
            ],
            apps: [
                { name: "TikTok You v3.4", url: "https://t.me/tiktokyou/49", desc: "Модифицированный клиент TikTok" },
                { name: "Wallify", url: "https://t.me/WallifyApp/4/1993", desc: "Красивые живые обои на телефон" },
                { name: "Larpkeeper", url: "https://t.me/vcvk1/1406", desc: "Фейковый Tonkeeper" }
            ],
            // ✅ ИЗМЕНЕНО НАЗВАНИЕ БОТА
            bots: [
                { name: "ChimeraNFT support", url: "https://t.me/eblannftsupbot", desc: "Поддержка разработки" }
            ]
        };

        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
        tg.setHeaderColor('#050507');
        tg.setBackgroundColor('#050507');
        const haptic = (type = 'light') => tg.HapticFeedback?.impactOccurred(type);

        let state = { activeTab: 'plugins', searchQuery: '', currentPage: 1, itemsPerPage: 5, tabsPage: 1 };

        function createRipple(event, element) {
            const ripple = document.createElement('span');
            const rect = element.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height);
            const x = event.clientX - rect.left - size / 2;
            const y = event.clientY - rect.top - size / 2;
            ripple.style.width = ripple.style.height = size + 'px';
            ripple.style.left = x + 'px';
            ripple.style.top = y + 'px';
            ripple.classList.add('ripple');
            element.appendChild(ripple);
            setTimeout(() => ripple.remove(), 600);
        }

        document.querySelectorAll('.tab, .nav-tab').forEach(tab => {
            tab.addEventListener('click', function(e) { createRipple(e, this); });
        });

        function goToTabsPage(page) {
            haptic('medium');
            state.tabsPage = page;
            document.getElementById('tabsPage1').style.display = page === 1 ? 'flex' : 'none';
            document.getElementById('tabsPage2').style.display = page === 2 ? 'flex' : 'none';
            state.activeTab = page === 1 ? 'plugins' : 'modules';
            state.searchQuery = '';
            state.currentPage = 1;
            document.getElementById('searchInput').value = '';
            document.getElementById('clearSearch').classList.remove('visible');
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            const tabs = document.querySelectorAll(`#tabsPage${page} .tab`);
            if (tabs.length > 0) tabs[0].classList.add('active');
            renderList();
        }

        let secretClicks = 0;
        let lastClickTime = 0;
        document.getElementById('titleClick').addEventListener('click', function() {
            const now = Date.now();
            if (now - lastClickTime > 2000) secretClicks = 0;
            secretClicks++;
            lastClickTime = now;
            const counter = document.getElementById('secretCounter');
            counter.classList.add('visible', 'pulse');
            setTimeout(() => counter.classList.remove('pulse'), 300);
            if (secretClicks >= 7) {
                haptic('heavy');
                openSecret();
                secretClicks = 0;
                counter.classList.remove('visible');
            }
            setTimeout(() => {
                if (Date.now() - lastClickTime >= 2000) {
                    secretClicks = 0;
                    counter.classList.remove('visible');
                }
            }, 2000);
        });

        function getFilteredItems() {
            if (state.searchQuery) {
                return Object.values(DATA).flat().filter(item => 
                    item && item.name && (item.name.toLowerCase().includes(state.searchQuery) || (item.desc && item.desc.toLowerCase().includes(state.searchQuery)))
                );
            }
            return DATA[state.activeTab] || [];
        }

        function switchTab(tab, element) {
            haptic('medium');
            state.activeTab = tab;
            state.searchQuery = '';
            state.currentPage = 1;
            document.getElementById('searchInput').value = '';
            document.getElementById('clearSearch').classList.remove('visible');
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            if (element) element.classList.add('active');
            renderList();
        }

        function handleSearch(query) {
            haptic('light');
            state.searchQuery = query.toLowerCase().trim();
            state.currentPage = 1;
            document.getElementById('clearSearch').classList.toggle('visible', state.searchQuery.length > 0);
            renderList();
        }

        function clearSearchInput() {
            haptic('light');
            document.getElementById('searchInput').value = '';
            handleSearch('');
        }

        function goToPage(page) {
            haptic('light');
            state.currentPage = page;
            renderList();
            document.getElementById('content-list').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function renderList() {
            const list = document.getElementById('content-list');
            const pagination = document.getElementById('pagination');
            const filtered = getFilteredItems();
            const totalPages = Math.ceil(filtered.length / state.itemsPerPage) || 1;
            if (state.currentPage > totalPages) state.currentPage = 1;

            if (totalPages > 1) {
                pagination.classList.add('visible');
                const dotsContainer = document.getElementById('pageDots');
                dotsContainer.innerHTML = '';
                for (let i = 1; i <= totalPages; i++) {
                    const dot = document.createElement('div');
                    dot.className = `page-dot ${i === state.currentPage ? 'active' : ''}`;
                    dot.onclick = () => goToPage(i);
                    dotsContainer.appendChild(dot);
                }
            } else {
                pagination.classList.remove('visible');
            }

            list.innerHTML = '';
            if (filtered.length === 0) {
                let emptyMsg = state.activeTab === 'bots' ? '🚧 Раздел в разработке...<br>Скоро здесь появятся лучшие боты' : 'Ничего не найдено';
                list.innerHTML = `<div class="empty-state animate-in"><i class="fas fa-ghost"></i><br>${emptyMsg}</div>`;
                return;
            }

            const start = (state.currentPage - 1) * state.itemsPerPage;
            const end = start + state.itemsPerPage;
            const pageItems = filtered.slice(start, end);

            pageItems.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'item-card animate-in';
                div.style.animationDelay = `${index * 0.06}s`;
                
                // ✅ ИСПРАВЛЕНИЕ: Отталкивание применяется только к .icon-svg, не к .icon-wrapper
                div.addEventListener('mousemove', (e) => {
                    const rect = div.getBoundingClientRect();
                    const mouseX = e.clientX - rect.left;
                    const mouseY = e.clientY - rect.top;
                    const centerX = rect.width / 2;
                    const centerY = rect.height / 2;
                    const maxOffset = 6;
                    const offsetX = -((mouseX - centerX) / centerX) * maxOffset;
                    const offsetY = -((mouseY - centerY) / centerY) * maxOffset;
                    
                    div.style.setProperty('--mouse-x', `${mouseX}px`);
                    div.style.setProperty('--mouse-y', `${mouseY}px`);
                    
                    // ✅ ВАЖНО: Применяем transform только к .icon-svg, не к .icon-wrapper
                    const svg = div.querySelector('.icon-svg');
                    if (svg) {
                        svg.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
                    }
                });
                
                div.addEventListener('mouseleave', () => {
                    const svg = div.querySelector('.icon-svg');
                    if (svg) {
                        svg.style.transform = 'translate(0, 0)';
                    }
                });
                
                let displayName = item.name;
                if (state.searchQuery) {
                    const regex = new RegExp(`(${state.searchQuery})`, 'gi');
                    displayName = item.name.replace(regex, '<span style="color: var(--plugin); font-weight: 700;">$1</span>');
                }

                let iconHTML = '';
                if (state.activeTab === 'plugins' && ICONS.plugins[item.name]) {
                    iconHTML = `<div class="icon-wrapper">${ICONS.plugins[item.name]}</div>`;
                } else if (state.activeTab === 'modules' && ICONS.modules[item.name]) {
                    iconHTML = `<div class="icon-wrapper">${ICONS.modules[item.name]}</div>`;
                } else if (state.activeTab === 'bots' && ICONS.bots[item.name]) {
                    iconHTML = `<div class="icon-wrapper">${ICONS.bots[item.name]}</div>`;
                } else if (state.activeTab === 'apps' && ICONS.apps[item.name]) {
                    iconHTML = `<div class="icon-wrapper">${ICONS.apps[item.name]}</div>`;
                } else {
                    iconHTML = `<div class="icon-wrapper"><i class="fas fa-cube" style="font-size: 24px; color: var(--module);"></i></div>`;
                }

                div.innerHTML = `
                    <div class="item-info" onclick="openLink('${item.url}')">
                        ${iconHTML}
                        <div style="flex:1; min-width:0;">
                            <div class="item-name">${displayName}</div>
                            <div class="item-desc">${item.desc || ''}</div>
                        </div>
                    </div>
                    <div class="action-btns">
                        <div class="icon-btn" onclick="copyLink('${item.url}', event)" title="Копировать"><i class="fas fa-copy"></i></div>
                        <div class="icon-btn open-btn" onclick="openLink('${item.url}')" title="Открыть"><i class="fas fa-external-link-alt"></i></div>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        function openLink(url) { haptic('heavy'); tg.openTelegramLink(url); }
        function copyLink(url, event) {
            event.stopPropagation();
            haptic('medium');
            navigator.clipboard.writeText(url).then(() => {
                const toast = document.getElementById('toast');
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2000);
            });
        }

        function openSecret() {
            haptic('heavy');
            document.getElementById('view-main').classList.remove('active');
            document.getElementById('view-secret').classList.add('active');
            tg.BackButton.show();
            tg.BackButton.onClick(closeSecret);
        }

        function closeSecret() {
            haptic('medium');
            document.getElementById('view-secret').classList.remove('active');
            document.getElementById('view-main').classList.add('active');
            tg.BackButton.hide();
        }

        renderList();
    </script>
</body>
