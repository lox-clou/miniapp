<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Premium Catalog</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #0f0f0f);
            --text: var(--tg-theme-text-color, #ffffff);
            --hint: var(--tg-theme-hint-color, #999999);
            --link: var(--tg-theme-link-color, #3390ec);
            --btn: var(--tg-theme-button-color, #3390ec);
            --btn-text: var(--tg-theme-button-text-color, #ffffff);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #1c1c1e);
            --card-bg: rgba(255, 255, 255, 0.06);
            --border: rgba(255, 255, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif; }
        
        body { background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; padding-bottom: 40px; }

        .mesh-bg {
            position: fixed; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle at 50% 50%, rgba(51, 144, 236, 0.12), transparent 50%),
                        radial-gradient(circle at 80% 20%, rgba(150, 50, 255, 0.08), transparent 40%);
            z-index: -1; animation: meshMove 20s ease-in-out infinite alternate;
        }
        @keyframes meshMove { 0% { transform: translate(0, 0); } 100% { transform: translate(-5%, -5%); } }

        .app { max-width: 480px; margin: 0 auto; padding: 16px; }

        .header { text-align: center; margin-bottom: 20px; padding-top: 10px; }
        .header h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; background: linear-gradient(135deg, var(--text), var(--hint)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* Вкладки (Chips) */
        .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 16px; scrollbar-width: none; }
        .tabs::-webkit-scrollbar { display: none; }
        .tab {
            flex-shrink: 0; padding: 10px 18px; border-radius: 20px;
            background: var(--secondary-bg); border: 1px solid var(--border);
            color: var(--hint); font-size: 14px; font-weight: 600; cursor: pointer;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .tab.active { background: var(--btn); color: var(--btn-text); border-color: var(--btn); box-shadow: 0 4px 15px rgba(51, 144, 236, 0.3); }
        .tab:active { transform: scale(0.95); }

        /* Поиск */
        .search-box { position: relative; margin-bottom: 20px; }
        .search-input {
            width: 100%; background: var(--secondary-bg); border: 1px solid var(--border);
            border-radius: 16px; padding: 14px 16px 14px 44px; color: var(--text);
            font-size: 15px; outline: none; transition: all 0.2s;
        }
        .search-input:focus { border-color: var(--btn); box-shadow: 0 0 0 3px rgba(51, 144, 236, 0.15); }
        .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--hint); }

        /* Список */
        .items-list { display: flex; flex-direction: column; gap: 10px; }
        .item-card {
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: 18px; padding: 16px; display: flex; align-items: center;
            justify-content: space-between; cursor: pointer; transition: all 0.2s;
            position: relative; overflow: hidden;
        }
        .item-card:active { transform: scale(0.98); background: rgba(255,255,255,0.1); }
        .item-info { display: flex; align-items: center; gap: 14px; flex: 1; min-width: 0; }
        .item-icon { 
            width: 40px; height: 40px; border-radius: 12px; background: rgba(51, 144, 236, 0.15); 
            color: var(--link); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; 
        }
        .item-name { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item-desc { font-size: 12px; color: var(--hint); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .action-btns { display: flex; gap: 8px; }
        .icon-btn {
            width: 36px; height: 36px; border-radius: 10px; background: var(--secondary-bg);
            border: 1px solid var(--border); color: var(--hint); display: flex; align-items: center;
            justify-content: center; cursor: pointer; transition: all 0.2s; font-size: 14px;
        }
        .icon-btn:active { transform: scale(0.9); background: var(--btn); color: var(--btn-text); border-color: var(--btn); }

        .empty-state { text-align: center; padding: 40px 20px; color: var(--hint); }
        .empty-state i { font-size: 40px; margin-bottom: 12px; opacity: 0.4; }

        .fade-in { animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; transform: translateY(8px); }
        @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }
        
        /* Уведомление о копировании */
        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); color: white;
            padding: 12px 24px; border-radius: 30px; font-size: 14px; font-weight: 500;
            opacity: 0; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); z-index: 100;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>
<body>
    <div class="mesh-bg"></div>
    
    <div class="app">
        <div class="header fade-in">
            <h1>⚡ Premium Catalog</h1>
        </div>

        <div class="tabs fade-in" style="animation-delay: 0.05s;">
            <div class="tab active" onclick="switchTab('plugins')">📦 Плагины</div>
            <div class="tab" onclick="switchTab('modules')">🧩 Модули</div>
            <div class="tab" onclick="switchTab('apps')">📱 Приложения</div>
            <div class="tab" onclick="switchTab('bots')">🤖 Боты</div>
        </div>

        <div class="search-box fade-in" style="animation-delay: 0.1s;">
            <i class="fas fa-search search-icon"></i>
            <input type="text" class="search-input" id="searchInput" placeholder="Поиск по всему каталогу..." oninput="handleSearch(this.value)">
        </div>

        <div id="content-list" class="items-list fade-in" style="animation-delay: 0.15s;"></div>
    </div>

    <div class="toast" id="toast">✅ Ссылка скопирована!</div>

    <script>
        // 🗄️ ЕДИНАЯ БАЗА ДАННЫХ
        const DATA = {
            plugins: [
                { name: "LocalEditor", url: "https://t.me/exteraPluginsSup/221", desc: "Редактирование без пересылки" },
                { name: "Lyrics+", url: "https://t.me/thefantiq/22", desc: "Тексты песен прямо в плеере" },
                { name: "Animated Wallpaper", url: "https://t.me/swagnonher/321", desc: "Живые обои для фона чатов" },
                { name: "reSwaga", url: "https://t.me/meeowPlugins/213", desc: "Карточки и треки со всех площадок" },
                { name: "re:extera", url: "https://t.me/shikaatuxplugins/224", desc: "Расширенные настройки Extera" },
                { name: "Quotify+", url: "https://t.me/mur_live/1537", desc: "Создание красивых цитат" },
                { name: "Fake Gifts", url: "https://t.me/vcvk1/1365", desc: "NFT юзернеймы, номера и подарки" },
                { name: "miniPlayer+", url: "https://t.me/RnPlugins/1083", desc: "Продвинутый мини-плеер" },
                { name: "Hide link preview fork", url: "https://t.me/kchemniy_modules/125", desc: "Скрытие предпросмотра ссылок" },
                { name: "UITweaks x QuantaHut", url: "https://t.me/QuantaPlugins/210", desc: "Глубокая кастомизация интерфейса" },
                { name: "Log overlay", url: "https://t.me/RnPlugins/620", desc: "Отображение логов поверх экрана" },
                { name: "Transcriber fork", url: "https://t.me/kchemniy_modules/12", desc: "Расшифровка голосовых в текст" },
                { name: "Bot login", url: "https://t.me/kvucoPlugins/54", desc: "Удобный вход через ботов" }
            ],
            modules: [
                { name: "Source trigger", url: "https://t.me/RnPlugins/1097", desc: "Триггеры на сообщения" },
                { name: "Giveaway joiner", url: "https://t.me/kchemi_projects/142", desc: "Авто-участие в розыгрышах" },
                { name: "Module list", url: "https://t.me/kchemi_projects/207", desc: "Управление списком модулей" }
            ],
            apps: [
                { name: "TikTok You v3.4", url: "https://t.me/tiktokyou/49", desc: "Модифицированный клиент TikTok" },
                { name: "Wallify", url: "https://t.me/WallifyApp/4/1993", desc: "Красивые живые обои на телефон" },
                { name: "Larpkeeper", url: "https://t.me/vcvk1/1406", desc: "Фейковый Tonkeeper" }
            ],
            bots: [
                // Заготовка на будущее. Когда добавишь ботов, просто раскомментируй и добавь строки:
                // { name: "Название бота", url: "https://t.me/username", desc: "Описание бота" }
            ]
        };

        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
        
        const haptic = (type = 'light') => tg.HapticFeedback?.impactOccurred(type);

        let state = {
            activeTab: 'plugins',
            searchQuery: ''
        };

        function switchTab(tab) {
            haptic('medium');
            state.activeTab = tab;
            state.searchQuery = '';
            document.getElementById('searchInput').value = '';
            
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            
            renderList();
        }

        function handleSearch(query) {
            haptic('light');
            state.searchQuery = query.toLowerCase().trim();
            renderList();
        }

        function renderList() {
            const list = document.getElementById('content-list');
            list.innerHTML = '';
            
            // Если есть поиск, ищем по ВСЕМ категориям. Иначе только в активной вкладке.
            let itemsToRender = [];
            if (state.searchQuery) {
                Object.values(DATA).flat().forEach(item => {
                    if (item.name.toLowerCase().includes(state.searchQuery) || item.desc.toLowerCase().includes(state.searchQuery)) {
                        itemsToRender.push(item);
                    }
                });
            } else {
                itemsToRender = DATA[state.activeTab] || [];
            }

            if (itemsToRender.length === 0) {
                list.innerHTML = `<div class="empty-state fade-in"><i class="fas fa-ghost"></i><br>Ничего не найдено</div>`;
                return;
            }

            itemsToRender.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'item-card fade-in';
                div.style.animationDelay = `${index * 0.04}s`;
                
                // Подсветка совпадений в поиске
                let displayName = item.name;
                if (state.searchQuery) {
                    const regex = new RegExp(`(${state.searchQuery})`, 'gi');
                    displayName = item.name.replace(regex, '<span style="color: var(--link); font-weight: 700;">$1</span>');
                }

                div.innerHTML = `
                    <div class="item-info" onclick="openLink('${item.url}')">
                        <div class="item-icon"><i class="fas fa-bolt"></i></div>
                        <div style="flex:1; min-width:0;">
                            <div class="item-name">${displayName}</div>
                            <div class="item-desc">${item.desc}</div>
                        </div>
                    </div>
                    <div class="action-btns">
                        <div class="icon-btn" onclick="copyLink('${item.url}', event)" title="Копировать ссылку">
                            <i class="fas fa-copy"></i>
                        </div>
                        <div class="icon-btn" onclick="openLink('${item.url}')" style="background: var(--btn); color: var(--btn-text); border-color: var(--btn);" title="Открыть">
                            <i class="fas fa-external-link-alt"></i>
                        </div>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        function openLink(url) {
            haptic('heavy');
            tg.openTelegramLink(url);
        }

        function copyLink(url, event) {
            event.stopPropagation(); // Чтобы не срабатывал клик по карточке
            haptic('medium');
            navigator.clipboard.writeText(url).then(() => {
                showToast();
            });
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // Инициализация темы Telegram
        if (tg.themeParams.bg_color) {
            document.documentElement.style.setProperty('--bg', tg.themeParams.bg_color);
            document.documentElement.style.setProperty('--text', tg.themeParams.text_color);
            document.documentElement.style.setProperty('--hint', tg.themeParams.hint_color);
            document.documentElement.style.setProperty('--link', tg.themeParams.link_color);
            document.documentElement.style.setProperty('--btn', tg.themeParams.button_color);
            document.documentElement.style.setProperty('--btn-text', tg.themeParams.button_text_color);
            document.documentElement.style.setProperty('--secondary-bg', tg.themeParams.secondary_bg_color);
        }

        // Первичный рендер
        renderList();
    </script>
</body>
</html>
