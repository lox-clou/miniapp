<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Каталог</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #050507;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-hover: rgba(255, 255, 255, 0.05);
            --text: #ffffff;
            --text-dim: #8b8b9e;
            --text-bright: #f0f0f5;
            --plugin: #00f2ff;
            --module: #ff9500;
            --app: #ff2d55;
            --bot: #bd00ff;
            --secret: #bd00ff;
            --border: rgba(255, 255, 255, 0.08);
            --border-bright: rgba(255, 255, 255, 0.15);
            --glow: 0 0 20px;
            --skeleton: rgba(255, 255, 255, 0.04);
            --skeleton-shine: rgba(255, 255, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Inter', -apple-system, sans-serif; }
        
        body { background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; padding-bottom: 40px; }

        /* ✅ ACCESSIBILITY: Focus states */
        *:focus-visible {
            outline: 2px solid var(--plugin);
            outline-offset: 2px;
        }

        .ambient-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; background: var(--bg); }
        .aurora {
            position: absolute; width: 150%; height: 150%; top: -25%; left: -25%;
            background: conic-gradient(from 0deg at 50% 50%, transparent 0deg, rgba(0, 242, 255, 0.08) 60deg, transparent 120deg, rgba(255, 45, 85, 0.08) 180deg, transparent 240deg, rgba(189, 0, 255, 0.08) 300deg, transparent 360deg);
            animation: rotate 30s linear infinite; filter: blur(120px);
        }
        .aurora::after {
            content: ''; position: absolute; inset: 0;
            background: conic-gradient(from 180deg at 50% 50%, transparent 0deg, rgba(189, 0, 255, 0.06) 90deg, transparent 180deg, rgba(0, 242, 255, 0.06) 270deg, transparent 360deg);
            animation: rotate 40s linear infinite reverse; filter: blur(100px);
        }
        @keyframes rotate { from { transform: translate(0, 0) rotate(0deg); } to { transform: translate(0, 0) rotate(360deg); } }

        .noise {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.025; pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .app { max-width: 480px; margin: 0 auto; padding: 20px 16px 40px; position: relative; }

        .header { 
            display: flex; justify-content: center; align-items: center; margin-bottom: 32px; padding-top: 8px; position: relative;
        }
        .header h1 {
            font-size: 14px; font-weight: 900; letter-spacing: 5px; text-transform: uppercase;
            background: linear-gradient(135deg, #fff 0%, var(--plugin) 50%, var(--app) 100%);
            background-size: 200% 200%; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: gradientShift 6s ease infinite; cursor: pointer; user-select: none; transition: transform 0.1s ease; text-align: center;
        }
        .header h1:active { transform: scale(0.95); }
        @keyframes gradientShift { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
        
        .secret-counter {
            position: absolute; top: 50%; right: 0; transform: translateY(-50%); width: 6px; height: 6px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.1); opacity: 0; transition: opacity 0.3s ease; pointer-events: none;
        }
        .secret-counter.visible { opacity: 1; }
        .secret-counter.pulse { animation: counterPulse 0.3s ease; }
        @keyframes counterPulse {
            0%, 100% { transform: translateY(-50%) scale(1); }
            50% { transform: translateY(-50%) scale(2); background: rgba(189, 0, 255, 0.8); box-shadow: 0 0 10px rgba(189, 0, 255, 0.8); }
        }

        .tabs-container { display: flex; align-items: center; gap: 8px; margin-bottom: 24px; }
        .tabs { display: flex; gap: 8px; flex: 1; overflow: hidden; }
        
        .tab {
            flex: 1; padding: 13px 8px; border-radius: 100px; background: var(--card-bg); border: 1px solid var(--border);
            color: var(--text-dim); font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center; white-space: nowrap; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .tab.active { 
            color: #fff; background: rgba(255, 255, 255, 0.07); border-color: var(--border-bright); 
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255,255,255,0.15);
        }
        .tab:active { transform: scale(0.96); }
        .tab-count {
            font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 8px;
            background: rgba(255, 255, 255, 0.1); color: var(--text-dim);
        }
        .tab.active .tab-count { background: rgba(0, 242, 255, 0.2); color: var(--plugin); }
        
        .tab .ripple, .nav-tab .ripple, .page-btn .ripple, .scroll-top .ripple {
            position: absolute; border-radius: 50%; background: rgba(255, 255, 255, 0.2);
            transform: scale(0); animation: ripple 0.6s linear; pointer-events: none;
        }
        @keyframes ripple { to { transform: scale(4); opacity: 0; } }

        .nav-tab {
            flex-shrink: 0; width: 44px; height: 44px; border-radius: 100px; background: var(--card-bg); border: 1px solid var(--border);
            color: var(--text-dim); display: flex; align-items: center; justify-content: center; cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); font-size: 14px; position: relative; overflow: hidden;
        }
        .nav-tab:hover { color: #fff; background: var(--card-hover); border-color: var(--border-bright); transform: scale(1.05); }
        .nav-tab:active { transform: scale(0.95); }

        .search-box { position: relative; margin-bottom: 28px; }
        .search-input {
            width: 100%; background: var(--card-bg); border: 1px solid var(--border); border-radius: 18px;
            padding: 16px 45px 16px 50px; color: var(--text); font-size: 15px; outline: none; transition: all 0.3s;
        }
        .search-input::placeholder { color: var(--text-dim); }
        .search-input:focus { border-color: var(--plugin); box-shadow: 0 0 0 3px rgba(0, 242, 255, 0.1), var(--glow) rgba(0, 242, 255, 0.15); background: var(--card-hover); }
        .search-icon { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--text-dim); transition: color 0.3s; pointer-events: none; }
        .search-input:focus ~ .search-icon { color: var(--plugin); }
        .clear-search {
            position: absolute; right: 16px; top: 50%; transform: translateY(-50%); color: var(--text-dim);
            cursor: pointer; opacity: 0; transition: all 0.2s; pointer-events: none; padding: 8px;
        }
        .clear-search.visible { opacity: 1; pointer-events: all; }
        .clear-search:hover { color: var(--text); }

        /* ✅ FADE-IN анимация для плавного появления */
        .items-list { 
            display: flex; flex-direction: column; gap: 12px; min-height: 200px; 
            transition: opacity 0.3s ease, transform 0.3s ease;
            opacity: 1;
        }
        .items-list.fade-out { opacity: 0; transform: translateY(10px); }
        .items-list.fade-in { 
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* ✅ SKELETON LOADING с правильным border-radius */
        .skeleton-card {
            background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; padding: 16px;
            display: flex; align-items: center; gap: 16px; position: relative; overflow: hidden;
        }
        .skeleton-card::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, var(--skeleton-shine), transparent);
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer { 100% { left: 100%; } }
        .skeleton-icon { width: 52px; height: 52px; border-radius: 12px; background: var(--skeleton); flex-shrink: 0; }
        .skeleton-text { flex: 1; }
        .skeleton-line { height: 12px; background: var(--skeleton); border-radius: 6px; margin-bottom: 8px; }
        .skeleton-line:last-child { margin-bottom: 0; width: 60%; }
        
        .item-card {
            background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; padding: 16px;
            display: flex; align-items: center; justify-content: space-between; cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); position: relative; overflow: hidden;
        }
        .item-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(600px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(255, 255, 255, 0.08), transparent 40%);
            opacity: 0; transition: opacity 0.4s; pointer-events: none;
        }
        .item-card::after {
            content: ''; position: absolute; inset: 0; border-radius: 20px; padding: 1px;
            background: linear-gradient(135deg, rgba(0, 242, 255, 0.3), rgba(189, 0, 255, 0.3));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor; mask-composite: exclude; opacity: 0; transition: opacity 0.4s; pointer-events: none;
        }
        .item-card:hover { 
            transform: translateY(-3px); border-color: var(--border-bright); 
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6), 0 0 25px rgba(0, 242, 255, 0.08);
        }
        .item-card:hover::before { opacity: 1; }
        .item-card:hover::after { opacity: 1; }
        .item-card:active { transform: translateY(-1px) scale(0.99); }
        
        .item-info { 
            display: flex; align-items: center; gap: 16px; flex: 1; min-width: 0; position: relative; z-index: 1;
        }
        
        .icon-wrapper {
            width: 52px; height: 52px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .icon-svg {
            width: 100%; height: 100%;
            transform: translate(var(--offset-x, 0px), var(--offset-y, 0px));
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .item-card:hover .icon-wrapper { transform: scale(1.1); }
        .item-card:hover .plugin-svg { filter: drop-shadow(0 0 10px rgba(0, 242, 255, 0.6)); }
        .item-card:hover .module-svg { filter: drop-shadow(0 0 10px rgba(255, 149, 0, 0.6)); }
        .item-card:hover .bot-svg { filter: drop-shadow(0 0 10px rgba(189, 0, 255, 0.6)); }
        .item-card:hover .app-svg { filter: drop-shadow(0 4px 18px rgba(255, 45, 85, 0.5)); }

        .item-name { 
            font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color 0.3s ease;
        }
        .item-card:hover .item-name { color: var(--text-bright); }
        .item-desc { 
            font-size: 13px; color: var(--text-dim); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color 0.3s ease;
        }
        .item-card:hover .item-desc { color: rgba(255, 255, 255, 0.6); }
        
        .action-btns { display: flex; gap: 8px; flex-shrink: 0; position: relative; z-index: 1; }
        .icon-btn {
            width: 38px; height: 38px; border-radius: 12px; background: var(--card-bg); border: 1px solid var(--border);
            color: var(--text-dim); display: flex; align-items: center; justify-content: center; cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); font-size: 14px; position: relative; overflow: hidden;
        }
        .icon-btn:hover { color: #fff; background: var(--card-hover); border-color: var(--border-bright); transform: scale(1.1); }
        .icon-btn.open-btn { 
            background: linear-gradient(135deg, var(--plugin), #0099cc); color: #000; border-color: transparent; 
            box-shadow: 0 4px 15px rgba(0, 242, 255, 0.3); 
        }
        .icon-btn.open-btn:hover { box-shadow: 0 6px 25px rgba(0, 242, 255, 0.5); transform: scale(1.1); }
        .icon-btn:active { transform: scale(0.95); }

        .pagination-controls {
            display: flex; align-items: center; justify-content: center; gap: 16px; margin-top: 28px; padding: 8px;
            background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; backdrop-filter: blur(10px);
            opacity: 0; pointer-events: none; transform: translateY(10px); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .pagination-controls.visible { opacity: 1; pointer-events: all; transform: translateY(0); }
        .page-btn {
            width: 44px; height: 44px; border-radius: 12px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border);
            color: var(--text); display: flex; align-items: center; justify-content: center; cursor: pointer;
            transition: all 0.2s ease; position: relative; overflow: hidden;
        }
        .page-btn:hover:not(:disabled) { background: var(--card-hover); border-color: var(--border-bright); transform: scale(1.05); }
        .page-btn:active:not(:disabled) { transform: scale(0.95); }
        .page-btn:disabled { opacity: 0.2; cursor: not-allowed; transform: none; }
        .page-info { font-size: 14px; font-weight: 600; color: var(--text-dim); min-width: 70px; text-align: center; }
        .page-info span { color: var(--text); }

        /* ✅ SCROLL TO TOP с правильной позицией */
        .scroll-top {
            position: fixed; bottom: 24px; right: 24px; width: 52px; height: 52px; border-radius: 50%;
            background: linear-gradient(135deg, var(--plugin), #0099cc); color: #000; border: none;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            box-shadow: 0 8px 30px rgba(0, 242, 255, 0.4); font-size: 18px;
            opacity: 0; pointer-events: none; transform: translateY(20px) scale(0.8);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 99;
        }
        .scroll-top.visible { opacity: 1; pointer-events: all; transform: translateY(0) scale(1); }
        .scroll-top:hover { transform: translateY(-2px) scale(1.05); box-shadow: 0 12px 40px rgba(0, 242, 255, 0.6); }
        .scroll-top:active { transform: scale(0.95); }

        .view { display: none; }
        .view.active { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }

        .back-btn {
            display: inline-flex; align-items: center; gap: 8px; color: var(--plugin); font-size: 14px; font-weight: 600;
            margin-bottom: 28px; cursor: pointer; padding: 10px 18px; border-radius: 14px; transition: all 0.3s;
            background: rgba(0, 242, 255, 0.05); border: 1px solid rgba(0, 242, 255, 0.15);
        }
        .back-btn:hover { background: rgba(0, 242, 255, 0.1); transform: translateX(-4px); }
        .back-btn:active { transform: scale(0.96); }

        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-dim); }
        .empty-state i { font-size: 48px; margin-bottom: 16px; opacity: 0.2; }

        .secret-card { border-color: rgba(189, 0, 255, 0.3) !important; background: rgba(189, 0, 255, 0.05) !important; }
        .secret-card .item-name { color: var(--secret) !important; }
        .secret-card .icon-btn.open-btn { background: linear-gradient(135deg, var(--secret), #8800cc); color: #fff; box-shadow: 0 4px 20px rgba(189, 0, 255, 0.3); }

        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: rgba(10, 10, 15, 0.95); backdrop-filter: blur(20px); color: #fff;
            padding: 14px 28px; border-radius: 100px; font-size: 14px; font-weight: 600;
            opacity: 0; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); z-index: 100;
            border: 1px solid var(--border); display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .toast i { color: var(--plugin); }
        
        /* ✅ Swipe hint скрывается после первого использования */
        .swipe-hint {
            text-align: center; color: var(--text-dim); font-size: 12px; margin-top: 12px;
            opacity: 0; transition: opacity 0.5s ease; pointer-events: none;
        }
        .swipe-hint.visible { opacity: 0.5; }
        
        /* Loading state для вкладок */
        .tab.loading { pointer-events: none; opacity: 0.6; }
        .tab.loading::after {
            content: ''; position: absolute; top: 50%; left: 50%; width: 16px; height: 16px;
            border: 2px solid var(--text-dim); border-top-color: transparent; border-radius: 50%;
            animation: spin 0.6s linear infinite; transform: translate(-50%, -50%);
        }
        @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
    </style>
</head>
<body>
    <div class="ambient-bg"><div class="aurora"></div></div>
    <div class="noise"></div>
    
    <div class="app">
        <div id="view-main" class="view active">
            <div class="header animate-in" style="animation-delay: 0.05s;">
                <h1 id="titleClick" role="button" tabindex="0" aria-label="Каталог (секретная функция)">Каталог</h1>
                <div class="secret-counter" id="secretCounter" aria-hidden="true"></div>
            </div>

            <div class="tabs-container animate-in" style="animation-delay: 0.1s;" id="tabsPage1">
                <div class="tabs" role="tablist">
                    <button class="tab active" onclick="switchTab('plugins', this)" role="tab" aria-selected="true" aria-controls="content-list">
                        Плагины <span class="tab-count" id="count-plugins" aria-label="количество">0</span>
                    </button>
                    <button class="tab" onclick="switchTab('apps', this)" role="tab" aria-selected="false" aria-controls="content-list">
                        Приложения <span class="tab-count" id="count-apps" aria-label="количество">0</span>
                    </button>
                </div>
                <button class="nav-tab" onclick="goToTabsPage(2)" title="Следующая страница" aria-label="Следующая страница вкладок">
                    <i class="fas fa-chevron-right" aria-hidden="true"></i>
                </button>
            </div>

            <div class="tabs-container animate-in" style="animation-delay: 0.1s; display: none;" id="tabsPage2">
                <button class="nav-tab" onclick="goToTabsPage(1)" title="Предыдущая страница" aria-label="Предыдущая страница вкладок">
                    <i class="fas fa-chevron-left" aria-hidden="true"></i>
                </button>
                <div class="tabs" role="tablist">
                    <button class="tab" onclick="switchTab('modules', this)" role="tab" aria-selected="false" aria-controls="content-list">
                        Модули <span class="tab-count" id="count-modules" aria-label="количество">0</span>
                    </button>
                    <button class="tab" onclick="switchTab('bots', this)" role="tab" aria-selected="false" aria-controls="content-list">
                        Боты <span class="tab-count" id="count-bots" aria-label="количество">0</span>
                    </button>
                </div>
            </div>

            <div class="search-box animate-in" style="animation-delay: 0.15s;">
                <label for="searchInput" class="sr-only" style="position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;">Поиск</label>
                <input type="text" class="search-input" id="searchInput" placeholder="Поиск по каталогу..." aria-label="Поиск по каталогу">
                <i class="fas fa-search search-icon" aria-hidden="true"></i>
                <button class="clear-search" id="clearSearch" onclick="clearSearchInput()" aria-label="Очистить поиск" tabindex="-1">
                    <i class="fas fa-times" aria-hidden="true"></i>
                </button>
            </div>

            <div id="content-list" class="items-list" role="list" aria-live="polite"></div>
            
            <div class="pagination-controls" id="paginationControls" role="navigation" aria-label="Пагинация">
                <button class="page-btn" id="prevPageBtn" onclick="changePage(-1)" title="Предыдущая страница" aria-label="Предыдущая страница">
                    <i class="fas fa-chevron-left" aria-hidden="true"></i>
                </button>
                <div class="page-info" id="pageInfo" aria-live="polite">
                    <span id="currentPageNum">1</span> / <span id="totalPagesNum">1</span>
                </div>
                <button class="page-btn" id="nextPageBtn" onclick="changePage(1)" title="Следующая страница" aria-label="Следующая страница">
                    <i class="fas fa-chevron-right" aria-hidden="true"></i>
                </button>
            </div>
            
            <div class="swipe-hint" id="swipeHint" aria-hidden="true">← свайп для переключения →</div>
        </div>

        <div id="view-secret" class="view">
            <button class="back-btn animate-in" onclick="closeSecret()" aria-label="Вернуться в каталог">
                <i class="fas fa-arrow-left" aria-hidden="true"></i> Назад
            </button>
            <div class="header animate-in" style="animation-delay: 0.1s;">
                <h1 style="background: linear-gradient(135deg, var(--secret), var(--app)); -webkit-background-clip: text;">Secret</h1>
            </div>
            <div class="items-list" role="list">
                <div class="item-card secret-card animate-in" style="animation-delay: 0.2s;" onclick="openLink('https://t.me/exterapl/838')" role="listitem" tabindex="0">
                    <div class="item-info">
                        <div class="icon-wrapper"><i class="fas fa-skull" style="font-size: 24px; color: var(--secret);" aria-hidden="true"></i></div>
                        <div style="flex:1; min-width:0;">
                            <div class="item-name">Секретный Плагин</div>
                            <div class="item-desc">Доступ только для избранных</div>
                        </div>
                    </div>
                    <div class="action-btns">
                        <div class="icon-btn open-btn" aria-label="Открыть"><i class="fas fa-external-link-alt" aria-hidden="true"></i></div>
                    </div>
                </div>
            </div>

        function throttle(func, limit) {
            let inThrottle;
            return function(...args) {
                if (!inThrottle) {
                    func.apply(this, args);
                    inThrottle = true;
                    setTimeout(() => inThrottle = false, limit);

            };

        function createRipple(event, element) {
            // Игнорируем если элемент отключен
            if (element.disabled) return;
            
            const ripple = document.createElement('span');
            const rect = element.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height);
            
            // ✅ Правильное получение координат для touch и mouse
            let clientX, clientY;
            if (event.touches && event.touches.length > 0) {
                clientX = event.touches[0].clientX;
                clientY = event.touches[0].clientY;
            } else if (event.changedTouches && event.changedTouches.length > 0) {
                clientX = event.changedTouches[0].clientX;
                clientY = event.changedTouches[0].clientY;
            } else {
                clientX = event.clientX;
                clientY = event.clientY;
            }
            
            const x = clientX - rect.left - size / 2;
            const y = clientY - rect.top - size / 2;
            
            ripple.style.width = ripple.style.height = `${size}px`;
            ripple.style.left = `${x}px`;
            ripple.style.top = `${y}px`;
            ripple.classList.add('ripple');
            
            element.appendChild(ripple);
            
            // Удаляем ripple после анимации
            setTimeout(() => {
                if (ripple.parentNode) {
                    ripple.remove();
                }
            }, 600);
        }

        // Добавляем ripple ко всем интерактивным элементам
        document.querySelectorAll('.tab, .nav-tab, .page-btn, .scroll-top').forEach(el => {
            el.addEventListener('mousedown', function(e) { 
                if (e.button === 0) createRipple(e, this); // Только левая кнопка мыши
            });
            el.addEventListener('touchstart', function(e) { 
                createRipple(e, this); 
            }, { passive: true });
        });

        // ========================================
        // 📑 ПЕРЕКЛЮЧЕНИЕ СТРАНИЦ ВКЛАДОК
        // ========================================
        function goToTabsPage(page) {
            if (state.isAnimating) return;
            
            haptic('medium');
            state.tabsPage = page;
            
            const page1 = document.getElementById('tabsPage1');
            const page2 = document.getElementById('tabsPage2');
            
            page1.style.display = page === 1 ? 'flex' : 'none';
            page2.style.display = page === 2 ? 'flex' : 'none';
            
            // Автоматически переключаем на первую вкладку новой страницы
            state.activeTab = page === 1 ? 'plugins' : 'modules';
            state.searchQuery = '';
            state.currentPage = 1;
            
            document.getElementById('searchInput').value = '';
            document.getElementById('clearSearch').classList.remove('visible');
            
            // Сбрасываем активные вкладки
            document.querySelectorAll('.tab').forEach(t => {
                t.classList.remove('active');
                t.setAttribute('aria-selected', 'false');
            });
            
            const tabs = document.querySelectorAll(`#tabsPage${page} .tab`);
            if (tabs.length > 0) {
                tabs[0].classList.add('active');
                tabs[0].setAttribute('aria-selected', 'true');
            }
            
            renderList();
        }

        // ========================================
        // 🔐 СЕКРЕТНАЯ ФУНКЦИЯ
        // ========================================
        let secretClicks = 0;
        let lastClickTime = 0;
        const SECRET_CLICKS_REQUIRED = 7;
        const SECRET_CLICK_TIMEOUT = 2000;

        const titleClick = document.getElementById('titleClick');
        
        function handleSecretClick() {
            const now = Date.now();
            
            // Сбрасываем счётчик если прошло больше 2 секунд
            if (now - lastClickTime > SECRET_CLICK_TIMEOUT) {
                secretClicks = 0;
            }
            
            secretClicks++;
            lastClickTime = now;
            
            const counter = document.getElementById('secretCounter');
            counter.classList.add('visible', 'pulse');
            setTimeout(() => counter.classList.remove('pulse'), 300);
            
            // Проверяем достижение порога
            if (secretClicks >= SECRET_CLICKS_REQUIRED) {
                haptic('heavy');
                openSecret();
                secretClicks = 0;
                counter.classList.remove('visible');
                return;
            }
            
            // Скрываем счётчик через таймаут
            setTimeout(() => {
                if (Date.now() - lastClickTime >= SECRET_CLICK_TIMEOUT) {
                    secretClicks = 0;
                    counter.classList.remove('visible');
                }
            }, SECRET_CLICK_TIMEOUT);
        }

        titleClick.addEventListener('click', handleSecretClick);
        titleClick.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                handleSecretClick();
            }
        });

        // ========================================
        // 🔍 ПОИСК (с debounce)
        // ========================================
        function getFilteredItems() {
            if (state.searchQuery) {
                const query = state.searchQuery.toLowerCase();
                return Object.values(DATA).flat().filter(item => 
                    item && item.name && (
                        item.name.toLowerCase().includes(query) || 
                        (item.desc && item.desc.toLowerCase().includes(query))
                    )
                );
            }
            return DATA[state.activeTab] || [];
        }

        const searchInput = document.getElementById('searchInput');
        const clearSearchBtn = document.getElementById('clearSearch');

        const debouncedSearch = debounce((query) => {
            state.searchQuery = query.toLowerCase().trim();
            state.currentPage = 1;
            renderList();
        }, 150);

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value;
            clearSearchBtn.classList.toggle('visible', query.length > 0);
            clearSearchBtn.tabIndex = query.length > 0 ? 0 : -1;
            debouncedSearch(query);
        });

        function clearSearchInput() {
            haptic('light');
            searchInput.value = '';
            clearSearchBtn.classList.remove('visible');
            clearSearchBtn.tabIndex = -1;
            state.searchQuery = '';
            state.currentPage = 1;
            renderList();
            searchInput.focus();
        }

        // ========================================
        // 📑 ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК
        // ========================================
        function switchTab(tab, element) {
            if (state.isAnimating || state.activeTab === tab) return;
            
            haptic('medium');
            
            // Показываем loading state
            element.classList.add('loading');
            
            // Обновляем состояние
            document.querySelectorAll('.tab').forEach(t => {
                t.classList.remove('active');
                t.setAttribute('aria-selected', 'false');
            });
            element.classList.add('active');
            element.setAttribute('aria-selected', 'true');
            
            state.activeTab = tab;
            
            // Сохраняем поиск только если он активен
            if (!state.searchQuery) {
                state.currentPage = 1;
            }
            
            // Убираем loading после небольшой задержки
            setTimeout(() => {
                element.classList.remove('loading');
                renderList();
            }, 100);
        }

        // ========================================
        // 📄 ПЕРЕКЛЮЧЕНИЕ СТРАНИЦ (исправлены race conditions)
        // ========================================
        let pageChangeTimeout = null;

        function changePage(direction) {
            if (state.isAnimating) return;
            
            const filtered = getFilteredItems();
            const totalPages = Math.ceil(filtered.length / state.itemsPerPage) || 1;
            const newPage = state.currentPage + direction;
            
            // Проверяем границы
            if (newPage < 1 || newPage > totalPages) return;
            
            state.isAnimating = true;
            haptic('light');
            
            const list = document.getElementById('content-list');
            
            // Очищаем предыдущий timeout если есть
            if (pageChangeTimeout) {
                clearTimeout(pageChangeTimeout);
            }
            
            // Fade out
            list.classList.add('fade-out');
            list.classList.remove('fade-in');
            
            pageChangeTimeout = setTimeout(() => {
                state.currentPage = newPage;
                renderList();
                
                // Плавный скролл к началу списка
                const listElement = document.getElementById('content-list');
                const listRect = listElement.getBoundingClientRect();
                const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
                
                window.scrollTo({
                    top: listRect.top + scrollTop - 100,
                    behavior: 'smooth'
                });
                
                state.isAnimating = false;
            }, 300);
        }

        // ========================================
        // 👆 SWIPE ЖЕСТЫ (полностью переписаны)
        // ========================================
        let touchStartX = 0;
        let touchStartY = 0;
        let touchEndX = 0;
        let touchEndY = 0;
        let isSwiping = false;
        const SWIPE_THRESHOLD = 80;
        const SWIPE_VERTICAL_THRESHOLD = 50;

        const contentList = document.getElementById('content-list');

        contentList.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
            isSwiping = false;
        }, { passive: true });

        contentList.addEventListener('touchmove', (e) => {
            if (!isSwiping) {
                const deltaX = Math.abs(e.changedTouches[0].screenX - touchStartX);
                const deltaY = Math.abs(e.changedTouches[0].screenY - touchStartY);
                
                // ✅ Проверяем направление движения
                // Если вертикальное движение больше горизонтального - это скролл, не свайп
                if (deltaY > SWIPE_VERTICAL_THRESHOLD && deltaY > deltaX) {
                    return; // Это обычный скролл
                }
                
                // Если горизонтальное движение значительное - это свайп
                if (deltaX > 30) {
                    isSwiping = true;
                }
            }
        }, { passive: true });

        contentList.addEventListener('touchend', (e) => {
            // ✅ Игнорируем если это был клик на кнопку
            if (e.target.closest('.icon-btn') || e.target.closest('.item-info')) {
                return;
            }
            
            touchEndX = e.changedTouches[0].screenX;
            touchEndY = e.changedTouches[0].screenY;
            
            const deltaX = touchStartX - touchEndX;
            const deltaY = Math.abs(touchStartY - touchEndY);
            
            // ✅ Проверяем что это действительно горизонтальный свайп
            if (Math.abs(deltaX) > SWIPE_THRESHOLD && deltaY < SWIPE_VERTICAL_THRESHOLD) {
                // Показываем подсказку один раз
                const hint = document.getElementById('swipeHint');
                if (hint && !hint.dataset.shown) {
                    hint.classList.remove('visible');
                    hint.dataset.shown = 'true';
                }
                
                changePage(deltaX > 0 ? 1 : -1);
            }
        }, { passive: true });

        // Показываем подсказку свайпа на мобильных
        function showSwipeHint() {
            const isMobile = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
            const hint = document.getElementById('swipeHint');
            
            if (isMobile && hint && !hint.dataset.shown) {
                setTimeout(() => {
                    hint.classList.add('visible');
                    setTimeout(() => {
                        hint.classList.remove('visible');
                    }, 3000);
                }, 2000);
            }
        }

        // ========================================
        // ⬆️ SCROLL TO TOP (с throttling)
        // ========================================
        const scrollTopBtn = document.getElementById('scrollTopBtn');
        
        const throttledScroll = throttle(() => {
            const showButton = window.scrollY > 600;
            scrollTopBtn.classList.toggle('visible', showButton);
            scrollTopBtn.tabIndex = showButton ? 0 : -1;
        }, 100);

        window.addEventListener('scroll', throttledScroll, { passive: true });

        function scrollToTop() {
            haptic('light');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ========================================
        // 🎨 РЕНДЕР СПИСКА (исправлен skeleton)
        // ========================================
        function showSkeleton() {
            const list = document.getElementById('content-list');
            list.innerHTML = '';
            
            // ✅ Показываем skeleton только если есть данные для загрузки
            const filtered = getFilteredItems();
            if (filtered.length === 0) {
                return; // Не показываем skeleton для пустых результатов
            }
            
            for (let i = 0; i < Math.min(3, state.itemsPerPage); i++) {
                const skel = document.createElement('div');
                skel.className = 'skeleton-card';
                skel.setAttribute('aria-hidden', 'true');
                skel.innerHTML = `
                    <div class="skeleton-icon"></div>
                    <div class="skeleton-text">
                        <div class="skeleton-line"></div>
                        <div class="skeleton-line"></div>
                    </div>
                `;
                list.appendChild(skel);
            }
        }

        function renderList() {
            const list = document.getElementById('content-list');
            const pagination = document.getElementById('paginationControls');
            const filtered = getFilteredItems();
            const totalPages = Math.ceil(filtered.length / state.itemsPerPage) || 1;
            
            // ✅ Корректируем текущую страницу если она вышла за границы
            if (state.currentPage > totalPages) {
                state.currentPage = 1;
            }

            // Обновляем пагинацию
            if (totalPages > 1 && filtered.length > 0) {
                pagination.classList.add('visible');
                document.getElementById('currentPageNum').textContent = state.currentPage;
                document.getElementById('totalPagesNum').textContent = totalPages;
                document.getElementById('prevPageBtn').disabled = state.currentPage === 1;
                document.getElementById('nextPageBtn').disabled = state.currentPage === totalPages;
            } else {
                pagination.classList.remove('visible');
            }

            // Показываем skeleton если это не пустой результат
            if (filtered.length > 0) {
                showSkeleton();
            }
            
            // ✅ Задержка для плавности (только если есть данные)
            const delay = filtered.length > 0 ? 150 : 0;
            
            setTimeout(() => {
                list.innerHTML = '';
                
                if (filtered.length === 0) {
                    let emptyMsg = state.activeTab === 'bots' 
                        ? '🚧 Раздел в разработке...<br>Скоро здесь появятся лучшие боты' 
                        : state.searchQuery 
                            ? `Ничего не найдено по запросу «${state.searchQuery}»`
                            : 'Ничего не найдено';
                    
                    list.innerHTML = `
                        <div class="empty-state animate-in" role="status">
                            <i class="fas fa-ghost" aria-hidden="true"></i>
                            <br>${emptyMsg}
                        </div>
                    `;
                    list.classList.remove('fade-out');
                    list.classList.add('fade-in');
                    return;
                }

                const start = (state.currentPage - 1) * state.itemsPerPage;
                const end = start + state.itemsPerPage;
                const pageItems = filtered.slice(start, end);

                pageItems.forEach((item, index) => {
                    const div = document.createElement('div');
                    div.className = 'item-card animate-in';
                    div.style.animationDelay = `${index * 0.06}s`;
                    div.setAttribute('role', 'listitem');
                    div.setAttribute('tabindex', '0');
                    
                    // ✅ Throttled mousemove для производительности
                    const throttledMouseMove = throttle((e) => {
                        const rect = div.getBoundingClientRect();
                        const mouseX = e.clientX - rect.left;
                        const mouseY = e.clientY - rect.top;
                        const centerX = rect.width / 2;
                        const centerY = rect.height / 2;
                        const maxOffset = 6;
                        
                        div.style.setProperty('--mouse-x', `${mouseX}px`);
                        div.style.setProperty('--mouse-y', `${mouseY}px`);
                        
                        const svg = div.querySelector('.icon-svg');
                        if (svg) {
                            const offsetX = -((mouseX - centerX) / centerX) * maxOffset;
                            const offsetY = -((mouseY - centerY) / centerY) * maxOffset;
                            svg.style.setProperty('--offset-x', `${offsetX}px`);
                            svg.style.setProperty('--offset-y', `${offsetY}px`);
                        }
                    }, 16); // ~60fps
                    
                    div.addEventListener('mousemove', throttledMouseMove);
                    
                    div.addEventListener('mouseleave', () => {
                        const svg = div.querySelector('.icon-svg');
                        if (svg) {
                            svg.style.setProperty('--offset-x', '0px');
                            svg.style.setProperty('--offset-y', '0px');
                        }
                    });
                    
                    // Подсветка поиска
                    let displayName = item.name;
                    if (state.searchQuery) {
                        const escapedQuery = state.searchQuery.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                        const regex = new RegExp(`(${escapedQuery})`, 'gi');
                        displayName = item.name.replace(regex, '<mark style="background: rgba(0, 242, 255, 0.2); color: var(--plugin); padding: 0 2px; border-radius: 3px;">$1</mark>');
                    }

                    // Иконка
                    let iconHTML = '';
                    if (state.activeTab === 'plugins' && ICONS.plugins[item.name]) {
                        iconHTML = `<div class="icon-wrapper">${ICONS.plugins[item.name]}</div>`;
                    } else if (state.activeTab === 'modules' && ICONS.modules[item.name]) {
                        iconHTML = `<div class="icon-wrapper">${ICONS.modules[item.name]}</div>`;
                    } else if (state.activeTab === 'bots' && ICONS.bots[item.name]) {
                        iconHTML = `<div class="icon-wrapper">${ICONS.bots[item.name]}</div>`;
                    } else if (state.activeTab === 'apps' && ICONS.apps[item.name]) {
                        iconHTML = `<div class="icon-wrapper">${ICONS.apps[item.name]}</div>`;
                    } else {
                        iconHTML = `<div class="icon-wrapper"><i class="fas fa-cube" style="font-size: 24px; color: var(--module);" aria-hidden="true"></i></div>`;
                    }

                    div.innerHTML = `
                        <div class="item-info" onclick="openLink('${item.url}')" tabindex="0" role="button" aria-label="Открыть ${item.name}">
                            ${iconHTML}
                            <div style="flex:1; min-width:0;">
                                <div class="item-name">${displayName}</div>
                                <div class="item-desc">${item.desc || ''}</div>
                            </div>
                        </div>
                        <div class="action-btns">
                            <button class="icon-btn" onclick="copyLink('${item.url}', event)" title="Копировать" aria-label="Копировать ссылку">
                                <i class="fas fa-copy" aria-hidden="true"></i>
                            </button>
                            <button class="icon-btn open-btn" onclick="openLink('${item.url}')" title="Открыть" aria-label="Открыть ссылку">
                                <i class="fas fa-external-link-alt" aria-hidden="true"></i>
                            </button>
                        </div>
                    `;
                    list.appendChild(div);
                });
                
                // Fade in анимация
                list.classList.remove('fade-out');
                list.classList.add('fade-in');
                
                // Убираем класс fade-in после анимации
                setTimeout(() => {
                    list.classList.remove('fade-in');
                }, 400);
            }, delay);
        }

        // ========================================
        // 🔗 ОТКРЫТИЕ ССЫЛОК (с обработкой ошибок)
        // ========================================
        function openLink(url) {
            haptic('heavy');
            
            // Валидация URL
            if (!url || typeof url !== 'string') {
                showToast('Ошибка: неверная ссылка');
                return;
            }
            
            try {
                if (tg?.openTelegramLink) {
                    tg.openTelegramLink(url);
                } else {
                    // Fallback для браузеров
                    window.open(url, '_blank', 'noopener,noreferrer');
                }
            } catch (e) {
                console.error('Ошибка открытия ссылки:', e);
                showToast('Не удалось открыть ссылку');
            }
        }
        
        // ========================================
        // 📋 КОПИРОВАНИЕ (с fallback)
        // ========================================
        function copyLink(url, event) {
            if (event) {
                event.stopPropagation();
            }
            
            haptic('medium');
            
            // Валидация URL
            if (!url || typeof url !== 'string') {
                showToast('Ошибка: неверная ссылка');
                return;
            }
            
            // Современный Clipboard API
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(url).then(() => {
                    showToast('Ссылка скопирована!');
                }).catch(err => {
                    console.error('Clipboard API failed:', err);
                    fallbackCopy(url);
                });
            } else {
                fallbackCopy(url);
            }
        }

        // Fallback для старых браузеров
        function fallbackCopy(text) {
            const textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            textArea.style.left = '-999999px';
            textArea.style.top = '-999999px';
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            
            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    showToast('Ссылка скопирована!');
                } else {
                    showToast('Не удалось скопировать');
                }
            } catch (err) {
                console.error('Fallback copy failed:', err);
                showToast('Не удалось скопировать');
            }
            
            document.body.removeChild(textArea);
        }

        // ========================================
        // 🍞 TOAST УВЕДОМЛЕНИЯ
        // ========================================
        let toastTimeout = null;

        function showToast(text) {
            const toastText = document.getElementById('toastText');
            const toast = document.getElementById('toast');
            
            // Очищаем предыдущий timeout
            if (toastTimeout) {
                clearTimeout(toastTimeout);
            }
            
            toastText.textContent = text;
            toast.classList.add('show');
            
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        // ========================================
        // 🔐 SECRET VIEW
        // ========================================
        function openSecret() {
            if (state.secretViewActive) return;
            
            haptic('heavy');
            state.previousView = 'main';
            state.secretViewActive = true;
            
            document.getElementById('view-main').classList.remove('active');
            document.getElementById('view-secret').classList.add('active');
            
            if (tg?.BackButton) {
                tg.BackButton.show();
                tg.BackButton.onClick(closeSecret);
            }
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function closeSecret() {
            if (!state.secretViewActive) return;
            
            haptic('medium');
            state.secretViewActive = false;
            
            document.getElementById('view-secret').classList.remove('active');
            document.getElementById('view-main').classList.add('active');
            
            if (tg?.BackButton) {
                tg.BackButton.hide();
            }
            
            state.previousView = null;
        }

        // ========================================
        // 🚀 ИНИЦИАЛИЗАЦИЯ
        // ========================================
        initCounts();
        renderList();
        showSwipeHint();

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && state.secretViewActive) {
                closeSecret();
            }
        });

        // Предотвращаем двойной тап на мобильных (zoom)
        let lastTouchEnd = 0;
        document.addEventListener('touchend', (e) => {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) {
                e.preventDefault();
            }
            lastTouchEnd = now;
        }, false);

    </script>
</body>
